<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">

<title>資源班個管排課系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Iansui&display=swap" rel="stylesheet">
<style>
/* 主色：寧靜藍 #b3cee5（查詢／主要按鈕）＋ 石英粉 #f7cac9（後台／強調）
   兩色都偏淺，因此填色用原色、文字與底線另外使用加深色，確保對比足夠 */
:root{
  --serenity:#b3cee5; --quartz:#f7cac9;
  --bg:#f4f8fc; --card:#fff; --ink:#1f2f45; --muted:#5f6f84; --line:#e2e9f1; --line2:#c9d6e3;
  --pri:#b3cee5; --pri-hover:#a1c1dd; --pri-ink:#1f3a56; --pri-soft:#e9f1f9; --pri-strong:#3d6b93;
  --acc:#f7cac9; --acc-hover:#f2b8b7; --acc-ink:#6b2f2d; --acc-soft:#fdf1f0; --acc-strong:#b0504d;
  --ok:#067647; --ok-soft:#dcfae6; --warn:#b54708; --warn-soft:#fef0c7; --bad:#c01f0a; --bad-soft:#fee4e2;
  --radius:12px; --shadow:0 1px 2px rgba(31,58,86,.05),0 1px 3px rgba(31,58,86,.08);
  --font:"Iansui","PingFang TC","Microsoft JhengHei","Heiti TC",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#10151c;--card:#18202a;--ink:#e6edf5;--muted:#9aa9ba;--line:#27323f;--line2:#384656;
  --pri:#b3cee5;--pri-hover:#c6dbee;--pri-ink:#16293d;--pri-soft:#1c2a3a;--pri-strong:#b3cee5;
  --acc:#f7cac9;--acc-hover:#fad9d8;--acc-ink:#4a1f1e;--acc-soft:#352323;--acc-strong:#f7cac9;
  --ok:#47cd89;--ok-soft:#0f2e1e;--warn:#f5b041;--warn-soft:#33270f;
  --bad:#f97066;--bad-soft:#381a16;--shadow:none}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pri-strong)}
.hidden{display:none!important}
.grow{flex:1}
.muted{color:var(--muted)}

/* header & nav */
.topbar{position:sticky;top:0;z-index:20;background:linear-gradient(100deg,var(--pri-soft),var(--card) 45%,var(--card) 60%,var(--acc-soft));border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:220px}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--serenity) 50%,var(--quartz) 50%);color:var(--pri-ink);display:grid;place-items:center;font-weight:700;font-size:17px;flex:none}
.brand b{font-size:16px;line-height:1.3}
.logo img{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
.hdprev{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px dashed var(--line2);border-radius:12px;background:var(--bg)}
#modeBtns{display:flex;gap:6px}
#syncStatus{font-size:12px;color:var(--muted);cursor:pointer;background:none;border:0;padding:0;text-align:left}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:var(--line2);vertical-align:1px}
.dot.ok{background:var(--ok)}.dot.warn{background:#e0a800;animation:blink 1s infinite}.dot.bad{background:var(--bad)}
@keyframes blink{50%{opacity:.35}}
#syncStatus.st-ok{color:var(--ok)}#syncStatus.st-warn{color:#946200}#syncStatus.st-bad{color:var(--bad);font-weight:700;background:var(--bad-soft);border-radius:6px;padding:1px 6px}
.yearpick{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
nav.tabs{background:var(--card);border-bottom:1px solid var(--line);padding:0 16px;position:sticky;top:59px;z-index:19}
.navrow{display:flex;gap:22px;overflow-x:auto;scrollbar-width:none}
.navrow::-webkit-scrollbar{display:none}
.navrow.groups{gap:8px;padding:10px 0 4px}
.gtab{border:1px solid var(--line2);background:var(--card);border-radius:999px;padding:5px 16px;cursor:pointer;white-space:nowrap;color:var(--muted);font-size:14px}
.gtab small{margin-left:6px;font-size:12px;opacity:.75}
.gtab.on{background:var(--acc);border-color:var(--acc-strong);color:var(--acc-ink);font-weight:700}
.indt{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin:4px 0}
.pg td,.pg th{vertical-align:middle}

.pg tr.flash td{animation:fl 1.6s}
@keyframes fl{0%,40%{background:var(--pri)}}
.itag.ro{padding:0 9px}
.roomtag{color:var(--acc-strong);font-weight:700}
.planform{max-width:794px}
.ptbl{width:100%;border-collapse:collapse;border:4px double #111;font-size:13.5px;color:#111;table-layout:fixed}
.ptbl th,.ptbl td{border:1px solid #111;padding:3px 6px;vertical-align:middle;color:#111}
.ptbl .ptitle{font-size:19px;font-weight:400;padding:8px 6px;letter-spacing:1px;text-align:center}
.ptbl .phead th{font-weight:700;text-align:center;font-size:14px}
.psvc{text-align:center;line-height:1.45}
.pnote{font-size:10px;font-weight:700;text-decoration:underline;line-height:1.3}
.plist{line-height:1.65}
.pc{text-align:center}
.plbl{text-align:center;font-weight:700;font-size:15px;line-height:1.7}
.ptbl td.psec{padding:4px 8px;line-height:1.8}
.pst{font-weight:700}
.pgrp{display:grid;grid-template-columns:auto 1fr;margin-left:16px}
.pgl{font-weight:700;white-space:nowrap}
.pck{margin-right:12px}
label.pck{cursor:pointer}
.pck input[type=checkbox]{width:15px;height:15px;margin:0 2px 0 0;vertical-align:-2px;accent-color:#1f3a56}
.ptbl input.pin{border:0;border-bottom:1.5px solid #333;border-radius:0;background:#fdf6d8;min-height:0;height:1.6em;padding:0 3px;font:inherit;color:#111;max-width:100%;text-align:center}
.pbv{display:inline-block;min-width:4.5em;border-bottom:1px solid #111;text-align:center;text-decoration:none;line-height:1.35;margin:0 2px;padding:0 3px}
.pstu{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.px{border:0;background:#fdecea;color:#7a2e2b;border-radius:50%;width:20px;height:20px;cursor:pointer;line-height:1;padding:0;font-size:14px}
.pmiss{font-size:11px;color:#b54708;white-space:nowrap}
.phint{font-size:11px;color:#555;line-height:1.3;margin-top:2px}
.ptbl select.padd{font-size:12px;min-height:28px;margin-top:3px;max-width:100%;padding:2px 4px;background:#f3f7fb;border:1px dashed #9fb3c8;color:#1f3a56}
@container (max-width:640px){ .ptbl{font-size:11.5px}.ptbl .ptitle{font-size:15px}.pgrp{margin-left:2px;grid-template-columns:1fr}.plbl{font-size:12px} }
body[data-pfont="kai"] .sheet{font-family:"DFKai-SB","BiauKai","標楷體","TW-Kai","Kaiti TC","STKaiti","LXGW WenKai TC",serif}
.ty-ind{background:#efe4fb;color:#6b2fa0}
.hi.ind b,.hi.ind .indtypes,.indnum{color:#6b2fa0}
.indwarn{font-size:11.5px;color:#9a4a00;background:#fff4e0;border-radius:6px;padding:2px 6px;margin-top:3px}
.itag{display:inline-flex;align-items:center;gap:2px;background:#fdecea;color:#7a2e2b;border-radius:999px;padding:0 4px 0 9px;font-size:12px;white-space:nowrap}
.itag button{border:0;background:none;cursor:pointer;color:inherit;font-size:14px;line-height:1;padding:2px 4px}
.indt select{min-height:30px;font-size:13px;padding:2px 6px}
.stbl .ind input:not([type]){width:100%}
.plan td,.plan th{text-align:center;vertical-align:middle}
.plan td.lst{text-align:left;line-height:1.75;font-family:inherit}
.plan h2{font-size:19px}
.plan .stbl{font-size:14px}.plan .stbl td,.plan .stbl th{padding:8px 10px}
@media (max-width:700px){.gtab small{display:none}.gtab{padding:5px 12px}}
.gintro{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.gmode{border-radius:12px;padding:14px 16px;border:1px solid var(--line)}
.gmode.front{background:var(--pri-soft);border-color:var(--pri)}
.gmode.back{background:var(--acc-soft);border-color:var(--acc)}
.gmode h3{margin:0 0 4px;font-size:16px}
.gmode ul{margin:6px 0 0;padding-left:20px;font-size:14px}
.gflow{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;counter-reset:f}
.gflow>li{border:1px solid var(--line);border-radius:12px;padding:12px 14px;position:relative;background:var(--card)}
.gflow ol li{border:0;padding:1px 0;background:none}
.gflow>li::before{counter-increment:f;content:counter(f);position:absolute;top:12px;right:12px;width:26px;height:26px;border-radius:50%;background:var(--pri);color:var(--pri-ink);display:grid;place-items:center;font-weight:700;font-size:13px}
.gflow b{display:block;font-size:15px;padding-right:30px}
.gflow{align-items:start}.gflow>li.wide{grid-column:1/-1}
.gcols.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.gcol{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg)}.gcol h5{margin:0 0 4px;font-size:14px;color:var(--pri-strong)}
@media (max-width:700px){.gcols.two{grid-template-columns:1fr}}.gflow summary{cursor:pointer;list-style:none}.gflow summary::-webkit-details-marker{display:none}
.gflow summary .when::after{content:'　▸ 展開';color:var(--pri-strong)}.gflow details[open] summary .when::after{content:'　▾ 收合'}
details.gfold{border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:10px}
details.gfold>summary{cursor:pointer;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:15px}
details.gfold>summary .mode{margin:0}details.gfold[open]>summary{margin-bottom:6px}
details.gfold.pick{margin-top:6px}details.gfold.pick>summary{font-size:14.5px}details.gfold.pick>summary .tag{margin:0}
.pager{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin:0 0 10px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.pager .pgno input{width:4.2em;text-align:center}.pager .pgname{font-size:15px;min-width:6em}.pager .pghint{font-size:12.5px}
@media (max-width:560px){.pager .pghint{display:none}.pager .btn{padding:6px 10px}}
details.gfold>summary::-webkit-details-marker{display:none}details.gfold>summary::before{content:'▸';color:var(--pri-strong);width:12px}details.gfold[open]>summary::before{content:'▾'}
.setup li small{display:block;color:var(--muted);font-size:12.5px;line-height:1.5;margin-top:2px}
.optag{font-style:normal;font-size:12px;border:1px solid var(--line2);border-radius:999px;padding:0 7px;margin-right:6px;color:var(--muted)}
.appfoot{max-width:1320px;margin:8px auto 0;padding:12px 12px 24px;border-top:1px solid var(--line);color:var(--muted);font-size:11.5px;line-height:1.6;text-align:center;overflow:hidden}
.appfoot p{margin:1px 0;white-space:nowrap}
.slotgrid{border-collapse:separate;border-spacing:3px;width:100%;max-width:560px;margin-top:6px;table-layout:fixed}
.slotgrid th{font-size:12.5px;font-weight:700;color:var(--muted);text-align:center;padding:0 2px}
.slotgrid tbody th{text-align:left;width:74px;font-weight:600;color:var(--ink);line-height:1.15}.slotgrid tbody th small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.slotgrid .slot{width:100%;min-height:32px;border:1px solid var(--line2);border-radius:7px;background:var(--card);cursor:pointer;font:inherit;font-size:12px;color:var(--muted);padding:0}
.slotgrid .slot:hover{border-color:var(--pri-strong)}
.slotgrid .slot.tb{background:var(--warn-soft);color:var(--warn)}.slotgrid .slot.sb{background:var(--bad-soft);color:var(--bad)}.slotgrid .slot.sib{background:var(--pri-soft);color:var(--pri-strong)}
.slotgrid .slot.on{background:var(--pri-strong);border-color:var(--pri-strong);color:#fff;font-weight:700;font-size:14px}
.slotgrid .slot.on.sb{background:var(--bad);border-color:var(--bad)}
.sibtog{gap:6px;margin:0 0 6px;font-size:14px}
details.slotbox{border:1px solid var(--line2);border-radius:10px;padding:8px 12px;background:var(--card)}
details.slotbox>summary{cursor:pointer;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;list-style:none}
details.slotbox>summary::-webkit-details-marker{display:none}
details.slotbox>summary::before{content:'▸';color:var(--pri-strong)}details.slotbox[open]>summary::before{content:'▾'}
details.faqfold>summary{font-size:18px}details.faqfold>summary .slothint::after{content:'（點這裡展開）';font-size:12.5px;font-weight:400;margin-left:6px;color:var(--muted)}details.faqfold[open]>summary .slothint::after{content:'（點這裡收合）'}
details.mpwarnbox>summary,details.mpdesc>summary{cursor:pointer}details.mpwarnbox>summary .slothint::after,details.mpdesc>summary .slothint::after{content:'（點這裡展開）';font-size:12.5px;font-weight:400;margin-left:6px}details.mpwarnbox[open]>summary .slothint::after,details.mpdesc[open]>summary .slothint::after{content:'（點這裡收合）'}
details.slotbox>summary .slothint::after{content:'點這裡展開小課表';font-size:12.5px;color:var(--pri-strong)}details.slotbox[open]>summary .slothint::after{content:'點這裡收合'}
#cSlotSum{font-size:14px}
.jumpbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 12px;padding:10px 12px;border:1px dashed var(--line2);border-radius:12px;background:var(--pri-soft)}
.jumpbar .jl{font-weight:700;font-size:14px;margin-right:4px}.jumpbar .chip{font-size:14px}.jumpbar .chip.jsub{font-size:13px;background:transparent;border-style:dashed}
.flash{animation:cardflash 1.4s ease;border-radius:10px}
.card.flash{animation:cardflash 1.4s ease}
@keyframes cardflash{0%,40%{box-shadow:0 0 0 3px var(--pri-strong)}100%{box-shadow:var(--shadow)}}.appfoot p.split span{display:block;width:max-content;max-width:100%;margin:0 auto}.appfoot p.split{margin:4px 0}
@media print{.appfoot{display:none}}
.gflow .when{font-size:12.5px;color:var(--muted);margin-bottom:6px}
.gflow ol{margin:0;padding-left:18px;font-size:13.5px;line-height:1.7}
.gsec{margin:18px 0 8px;display:flex;align-items:center;gap:8px;font-size:15px}
.gsec .mode{margin:0}
.glist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.gitem{border:1px solid var(--line);border-left:4px solid var(--pri);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;background:var(--card)}
.gitem.back{border-left-color:var(--acc-strong)}
.gitem h4{margin:0;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.gitem h4 small{font-weight:400;color:var(--muted);font-size:12px}

.gitem ul{margin:0;padding-left:18px;font-size:13px;color:var(--muted)}

.gfaq details{border-top:1px solid var(--line);padding:10px 2px}
.gfaq details:first-child{border-top:0}
.gfaq summary{cursor:pointer;font-weight:700;font-size:14.5px}
.fit-one{display:block}.desc-sm{font-size:13px}
.faqseg{flex-wrap:wrap;margin-bottom:8px}.faqseg button small{margin-left:4px;font-size:11px;color:var(--muted);font-weight:400}.faqseg button.on small{color:inherit}
.faqcat{display:inline-block;font-size:11.5px;font-weight:500;color:var(--pri-strong);border:1px solid var(--line2);border-radius:999px;padding:0 7px;margin-right:6px;vertical-align:1px}
.gfaq p{margin:6px 0 0;font-size:14px;color:var(--ink)}
.diag{list-style:none;margin:12px 0 0;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}

.diag li:first-child{border-top:0}

.diag .ok .ic{background:var(--ok-soft);color:var(--ok)}
.diag .fail .ic{background:var(--bad-soft);color:var(--bad)}
.diag .warn .ic{background:var(--warn-soft);color:var(--warn)}
.diag .skip .ic,.diag .run .ic{background:var(--bg);color:var(--muted)}
.diag .skip{opacity:.55}
.diag b{display:block;font-size:14px}

.diag .warn .fix{background:var(--warn-soft)}

.topact{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

main{max-width:1320px;margin:0 auto;padding:16px}

/* generic ui */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:16px}
.card-h{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}

.row+.row{margin-top:10px}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.field>*:not(span){color:var(--ink)}
input[type=text],input[type=number],input[type=url],input[type=password],input:not([type]),select,textarea{border:1px solid var(--line2);background:var(--card);border-radius:8px;padding:6px 10px;min-height:38px;max-width:100%}

.btn{border:1px solid var(--line2);background:var(--card);border-radius:8px;padding:6px 14px;min-height:38px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--bg)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--pri-ink);font-weight:700}

.mradj th{white-space:normal}.mradj td{white-space:nowrap}.mradj input{width:3.6em;min-height:30px;padding:2px 4px}
@media (max-width:560px){.mradj th,.mradj td{padding:4px}.mradj td:first-child b{font-size:12.5px}}
.mrsec{border:1px solid var(--line);border-radius:10px;padding:10px 12px;line-height:2}.mrsec input:not([type=checkbox]){min-height:30px;padding:2px 6px;width:4.5em}.mrsec label.row{align-items:flex-start;flex-wrap:nowrap;line-height:1.6;margin:4px 0}.mrsec label.row input{margin-top:3px}.mrsec h4{margin:0 0 4px;font-size:14.5px}.mrsec .desc{line-height:1.5}

.mpform .mph2 th{background:#dce8f3}.mpform th.vt{text-align:center;line-height:1.25}.mpform .stbl th{white-space:normal}.mpform .stbl.mpt2{margin-top:-1px}.mpform .stbl.mpt{table-layout:fixed}.mpform th.vt2{text-align:center}

ul.mpcheck{margin:0;padding-left:18px;line-height:1.7}ul.mpcheck li{margin:4px 0}ul.mpcheck li.ok b{color:var(--ok)}ul.mpcheck li.bad b{color:var(--bad)}ul.mpcheck li.warn b{color:var(--warn)}ul.mpcheck li.muted{color:var(--muted);font-size:13.5px}

/* pdf rendering */
#busy{position:fixed;inset:0;z-index:95;overflow:hidden;background:#fff}
#pdfStage{position:absolute;left:0;top:0;background:#fff}
#pdfStage .sheet{border:0;border-radius:0;margin:0;max-width:none;min-width:0}
#busy .veil{position:fixed;inset:0;background:rgba(244,246,250,.96);z-index:2}
#busy .busy-card{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);background:#fff;color:#1d2939;padding:22px 28px;border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.15);z-index:3;text-align:center;min-width:240px}
.spin{width:34px;height:34px;border:3px solid #f7cac9;border-top-color:#6f97bd;border-radius:50%;margin:0 auto 10px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ============ 響應式：手機／平板／電腦、直屏／橫屏 ============
   原則：畫面上一律維持「表格」，方便上下比較同一欄；
   窄螢幕改用欄位較少、字級較小的精簡表格。PDF 與列印永遠是完整表格。 */
.preview{container-type:inline-size}
.preview .sheet{min-width:0}
.daylist,.dl-pick,.edpick,.stbl.mini,.narrow-only{display:none}
.dl-pick{gap:4px;margin:4px 0 10px;flex-wrap:wrap}
.dl-pick button{flex:1;min-width:40px;min-height:38px;border:1px solid #c9d6e3;background:#fff;border-radius:8px;cursor:pointer;font-family:inherit;font-size:15px;color:#1f3a56}
.dl-pick button[data-day="week"],.dl-pick button[data-eday="week"]{flex:1.7}
.dl-pick button.on{background:#b3cee5;border-color:#6f97bd;font-weight:700}
.dl-day h4{margin:12px 0 6px;font-size:15px;color:#1f3a56;border-bottom:2px solid #b3cee5;padding-bottom:3px}
.dl-row{display:flex;gap:10px;padding:6px 0;border-bottom:1px dashed #d6e0ea}
.dl-p{width:64px;flex:none;font-size:13px;line-height:1.3}
.dl-p b{display:block}.dl-p span{color:#667;font-size:11.5px}
.dl-c{flex:1;min-width:0}
.dl-c .sc{margin:0 0 4px}
.dl-empty{color:#889;font-size:13px;padding:8px 0}
body[data-day="1"] .dl-day:not([data-d="1"]){display:none}
body[data-day="2"] .dl-day:not([data-d="2"]){display:none}
body[data-day="3"] .dl-day:not([data-d="3"]){display:none}
body[data-day="4"] .dl-day:not([data-d="4"]){display:none}
body[data-day="5"] .dl-day:not([data-d="5"]){display:none}
.stbl.mini td,.stbl.mini th{padding:4px 5px}
.stbl.mini tr.sub td{border-top:0;background:#fbfcfe;font-size:11.5px;padding-top:2px}
.stbl.mini .tags span{display:inline-block;font-size:10.5px;background:#eef4fa;border-radius:4px;padding:0 4px;margin:1px 2px 1px 0;white-space:nowrap}
.stbl.mini .nums{font-size:11px;line-height:1.45;white-space:nowrap}
.tbl.mini .sw{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px}
.tbl.mini td.needc{background:var(--warn-soft)}
.tbl.mini td:nth-child(2) b,.tbl.mini td:nth-child(4){white-space:nowrap}
.tbl.mini td:nth-child(3){font-size:12.5px}
/* 平板直屏、小筆電：週課表縮小字級與欄寬 */
@container (max-width:900px){
  .sheet{padding:12px 10px}
  .sheet h2{font-size:18px}
  .sgrid col:first-child{width:46px!important}.sgrid col:nth-child(2){width:50px!important}
  .sc{padding:2px 4px}.sc b{font-size:12px}.sc span{font-size:10.5px}
  .sgrid td.cell{height:auto!important;min-height:44px}
  .stbl{font-size:12px}
  .stbl th{white-space:normal}
  .stbl col.indcol{width:180px!important}
  .stbl .indt select{max-width:100%}
  .stbl .ind input:not([type]){width:100%}
}
/* 手機：週課表（預設）縮小塞進螢幕，也可切換單日；名冊、時數改用精簡表格 */
@container (max-width:640px){
  .sheet{padding:10px 8px;border-radius:12px}
  .sheet h2{font-size:17px}.sheet .sub{font-size:11.5px}
  .sheet .dl-pick{display:flex}
  .sgrid{font-size:10.5px}
  .sgrid col:first-child{width:36px!important}.sgrid col:nth-child(2){width:33px!important}
  .sgrid th,.sgrid td{padding:2px}
  .sgrid thead th{padding:5px 1px!important;font-size:12px}
  .sgrid tbody th{font-size:10.5px!important;line-height:1.2}
  .sgrid td.t{font-size:9px;line-height:1.2}
  .sgrid td.band{letter-spacing:3px;font-size:11px}
  .sgrid td.cell{min-height:32px}
  .sgrid .sc{padding:2px 3px;border-left-width:3px;margin:1px 0}
  .sgrid .sc b{font-size:11px!important;line-height:1.25}
  .sgrid .sc span{font-size:9.5px!important;line-height:1.25}
  body:not([data-day="week"]) .sheet .sgrid{display:none}
  body:not([data-day="week"]) .sheet .daylist{display:block}
  .daylist .sc b{font-size:14px}.daylist .sc span{font-size:12.5px}
  .sheet table.full{display:none}
  .sheet table.stbl.mini{display:table}
  .plan .stbl{font-size:12px}.plan .stbl td,.plan .stbl th{padding:5px}
  .sfoot{font-size:11.5px}
  .legend{font-size:11px;gap:8px}
}
/* 後台可編輯表格：平板直屏以下改用精簡表格，按「編輯」開視窗修改 */
@media (max-width:1100px){
  .wide-only{display:none!important}
  .narrow-only{display:block}
  .tbl th,.tbl td{padding:6px 5px}
}
@media (max-width:700px){
  .tbl{font-size:13.5px}
  .tbl input:not([type=checkbox]),.tbl select{width:100%!important;min-width:3.8em;font-size:14px;min-height:34px;padding:4px 6px}
  .tbl td .row{gap:4px}
  .tbl .btn.sm{white-space:normal}
  .tbl .btn.sm{padding:2px 8px}
  .edpick{display:flex}
  .egrid{min-width:0!important}
  body[data-eday="week"] .egrid thead th:first-child{width:44px!important}
  body[data-eday="week"] .egrid thead th{font-size:12px;padding:6px 1px}
  body[data-eday="week"] .egrid tbody th{font-size:11px;padding:4px 3px;line-height:1.2}
  body[data-eday="week"] .egrid tbody th small{display:none}
  body[data-eday="week"] .egrid td{padding:2px}
  body[data-eday="week"] .cchip{font-size:10.5px;padding:2px 3px;border-left-width:3px;line-height:1.25}
  body[data-eday="week"] .cchip small{font-size:9.5px}
  body[data-eday="week"] .cchip .muted{display:block}
  body[data-eday="week"] .egrid .eband{letter-spacing:2px;font-size:11px}
  body:not([data-eday="week"]) .egrid{table-layout:auto!important}
  body:not([data-eday="week"]) .egrid tr>:first-child{width:74px!important}
  body:not([data-eday="week"]) .cchip{font-size:14px}
  body[data-eday="1"] .egrid tr>:nth-child(n+2):not(:nth-child(2)):not(.eband){display:none}
  body[data-eday="2"] .egrid tr>:nth-child(n+2):not(:nth-child(3)):not(.eband){display:none}
  body[data-eday="3"] .egrid tr>:nth-child(n+2):not(:nth-child(4)):not(.eband){display:none}
  body[data-eday="4"] .egrid tr>:nth-child(n+2):not(:nth-child(5)):not(.eband){display:none}
  body[data-eday="5"] .egrid tr>:nth-child(n+2):not(:nth-child(6)):not(.eband){display:none}
  .modal:not(#ask){padding:0}
  .modal:not(#ask) .dlg{border-radius:0;min-height:100%}
  .row>.grow{display:none}
  .glist,.gintro,.gflow{grid-template-columns:minmax(0,1fr)!important}
}
@media (min-width:701px) and (max-width:1100px){
  .egrid{min-width:0}

const APPS_SCRIPT_CODE = "/**\n * 資源班個管排課系統 — Google 試算表後端（Apps Script）\n *\n * 使用方式：\n * 1. 建立一個新的 Google 試算表 → 擴充功能 → Apps Script\n * 2. 把這整份程式碼貼上（取代原本的內容）並儲存\n * 3. （建議）在下方 SECRET 設定一組存取金鑰，網頁端「資料與同步」要輸入相同金鑰\n * 4. 部署 → 新增部署作業 → 類型選「網頁應用程式」\n *    執行身分：我　／　誰可以存取：任何人\n * 5. 複製「網頁應用程式網址」，貼到網頁的「資料與同步」頁\n *\n * 之後修改程式碼時：部署 → 管理部署作業 → 編輯 → 版本選「新版本」，網址就不會改變。\n */\n\nconst SECRET = '';   // 例如 'ziyuan-2026'；留空代表不檢查金鑰\n\nconst VERSION = 3;   // 網頁的「測試連線」會檢查這個版本\n\nconst TABLES = ['config', 'years', 'teachers', 'rooms', 'classes', 'students', 'courses', 'plans'];\n\nfunction doGet(e) {\n  try {\n    const p = (e && e.parameter) || {};\n    if (SECRET && p.key !== SECRET) return out_({ ok: false, error: '存取金鑰錯誤', code: 'KEY' });\n    const ss = getSs_();\n    const updatedAt = getUpdatedAt_();\n    if (p.action === 'meta') {\n      return out_({ ok: true, version: VERSION, updatedAt: updatedAt, spreadsheet: ss.getName(),\n        sheets: ss.getSheets().map(function (sh) { return sh.getName(); }) });\n    }\n    return out_({ ok: true, version: VERSION, updatedAt: updatedAt, data: readAll_() });\n  } catch (err) {\n    return out_({ ok: false, error: String(err && err.message || err), code: err && err.code || 'SCRIPT' });\n  }\n}\n\nfunction doPost(e) {\n  let body;\n  try {\n    body = JSON.parse(e.postData.contents);\n  } catch (err) {\n    return out_({ ok: false, error: '資料格式錯誤' });\n  }\n  if (SECRET && body.key !== SECRET) return out_({ ok: false, error: '存取金鑰錯誤', code: 'KEY' });\n\n  // 測試連線用：確認能開啟試算表並取得鎖定，不會修改任何資料\n  if (body.action === 'ping') {\n    try {\n      const ss = getSs_();\n      const lk = LockService.getScriptLock();\n      if (!lk.tryLock(10000)) return out_({ ok: false, error: '伺服器忙碌，請稍後再試', code: 'BUSY' });\n      lk.releaseLock();\n      return out_({ ok: true, version: VERSION, spreadsheet: ss.getName() });\n    } catch (err) {\n      return out_({ ok: false, error: String(err && err.message || err), code: err && err.code || 'SCRIPT' });\n    }\n  }\n\n  const lock = LockService.getScriptLock();\n  if (!lock.tryLock(20000)) return out_({ ok: false, error: '伺服器忙碌，請稍後再試', code: 'BUSY' });\n  try {\n    getSs_();\n    const current = getUpdatedAt_();\n    // 若雲端在你上次同步後被別人改過，回報衝突，讓網頁端決定要覆蓋還是重新載入\n    if (!body.force && current && String(body.baseUpdatedAt || '') !== String(current)) {\n      return out_({ ok: false, conflict: true, updatedAt: current });\n    }\n    writeAll_(body.data || {}, body.headers || {});\n    const now = String(Date.now());\n    PropertiesService.getScriptProperties().setProperty('updatedAt', now);\n    return out_({ ok: true, updatedAt: now });\n  } catch (err) {\n    return out_({ ok: false, error: String(err && err.message || err), code: err && err.code || 'SCRIPT' });\n  } finally {\n    lock.releaseLock();\n  }\n}\n\nfunction readAll_() {\n  const ss = getSs_();\n  const data = {};\n  TABLES.forEach(function (name) {\n    const sh = ss.getSheetByName(name);\n    if (!sh || sh.getLastRow() < 1) { data[name] = []; return; }\n    const values = sh.getDataRange().getDisplayValues();\n    const head = values[0];\n    data[name] = values.slice(1)\n      .filter(function (r) { return r.some(function (x) { return x !== ''; }); })\n      .map(function (r) {\n        const o = {};\n        head.forEach(function (k, i) { if (k) o[k] = r[i]; });\n        return o;\n      });\n  });\n  return data;\n}\n\nfunction writeAll_(data, headers) {\n  const ss = getSs_();\n  TABLES.forEach(function (name) {\n    if (!(name in data)) return;\n    const rows = data[name] || [];\n    const head = (headers[name] || []).slice();\n    rows.forEach(function (r) {\n      Object.keys(r).forEach(function (k) { if (head.indexOf(k) < 0) head.push(k); });\n    });\n    if (!head.length) return;\n    const sh = ss.getSheetByName(name) || ss.insertSheet(name);\n    sh.clearContents();\n    const values = [head].concat(rows.map(function (r) {\n      return head.map(function (k) { return r[k] == null ? '' : String(r[k]); });\n    }));\n    const range = sh.getRange(1, 1, values.length, head.length);\n    range.setNumberFormat('@');   // 全部存成文字，避免「03」被轉成 3\n    range.setValues(values);\n    sh.setFrozenRows(1);\n  });\n}\n\nfunction getSs_() {\n  const ss = SpreadsheetApp.getActiveSpreadsheet();\n  if (!ss) {\n    const err = new Error('這份 Apps Script 沒有綁定試算表。請從試算表的「擴充功能 → Apps Script」建立程式。');\n    err.code = 'NO_SHEET';\n    throw err;\n  }\n  return ss;\n}\n\nfunction getUpdatedAt_() {\n  return PropertiesService.getScriptProperties().getProperty('updatedAt') || '';\n}\n\nfunction out_(obj) {\n  return ContentService.createTextOutput(JSON.stringify(obj))\n    .setMimeType(ContentService.MimeType.JSON);\n}\n";

/* 每 20 秒檢查雲端：別人改了資料就自動載入（正在輸入或開著視窗時先提示，不打斷） */
async function pollCloud() {
  if (!state.sync.url || state.pushing || state.status === 'busy' || document.hidden) return;
  if (state.sync.dirty) { if (state.sync.auto && retryReady()) push(); return; }
  const seq0 = state.seq;
  try {
    const j = await apiGet('meta');
    if (state.pushing || state.sync.dirty || state.seq !== seq0) return;   // 檢查期間有新修改：交給上傳流程
    if (String(j.updatedAt || '') === String(state.sync.lastUpdatedAt || '')) { state.sync.lastSyncAt = Date.now(); state.failCount = 0; if (state.status === 'error') setStatus('ok'); else renderStatus(); return; }
    const ae = document.activeElement, typing = ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName) && ae.id !== 'yearSel' && ae.id !== 'nameSel';
    if (typing || !$('#modal').classList.contains('hidden') || !$('#ask').classList.contains('hidden')) { state.pendingPull = true; renderStatus(); return; }
    state.pendingPull = false; await pull(true);
    if (state.status === 'ok' && !state.sync.dirty) toast(`已載入雲端最新資料（${fmtTime(+state.sync.lastUpdatedAt)}）`);
  } catch (e) { /* 網路暫時不通時不打擾，下一輪再試 */ }
}
setInterval(pollCloud, 20000);

  if (!state.sync.url) return connectDialog();

};

    /* 本機課程還在用、檔案裡沒有的節次保留下來，避免課程消失 */
    periods.forEach(pp => { if (!C.periods.some(x => x.id === pp.id) && db.courses.some(c => c.periodId === pp.id)) C.periods.push(pp); });
    (SC.reductions || []).forEach(r => { redMap[r.id] = r.id; }); (SC.supGroups || []).forEach(g => { grpMap[g.id] = g.id; });

    ['disabilities', 'giftCats'].forEach(k => { C[k] = unionBy(C[k] || [], SC[k], x => x.name); });
    C.reductions = C.reductions || [];
    (SC.reductions || []).forEach(r => { const m = C.reductions.find(x => x.name === r.name); if (m) redMap[r.id] = m.id; else { const id = has(C.reductions, r.id) ? uid() : r.id; C.reductions.push(Object.assign({}, r, { id })); redMap[r.id] = id; n.cfg++; } });
    C.supGroups = C.supGroups || [];
    (SC.supGroups || []).forEach(g => { const m = C.supGroups.find(x => x.name === g.name); if (m) { grpMap[g.id] = m.id; g.items.forEach(it => { if (!m.items.includes(it)) { m.items.push(it); n.cfg++; } }); } else { const id = C.supGroups.some(x => x.id === g.id) ? uid() : g.id; C.supGroups.push(Object.assign({}, g, { id, items: g.items.slice() })); grpMap[g.id] = id; n.cfg++; } });
    C.subtypes = C.subtypes || {};
    Object.entries(SC.subtypes || {}).forEach(([k, a]) => { const cur = C.subtypes[k] || []; a.forEach(x => { if (!cur.includes(x)) { cur.push(x); n.cfg++; } }); C.subtypes[k] = cur; });
    ['schoolName', 'sysName'].forEach(k => { if (!C[k] && SC[k]) { C[k] = SC[k]; n.cfg++; } });
    Object.entries(SC.loads || {}).forEach(([k, v]) => { C.loads = C.loads || {}; if (!C.loads[k]) { C.loads[k] = v; n.cfg++; } });

  src.years.forEach(y => { if (!has(db.years, y.id)) { db.years.push(Object.assign({}, y)); n.years++; } });
  if (!C.currentYear && SC.currentYear) C.currentYear = SC.currentYear;
  /* 教室、教師 */
  const roomMap = {}, tMap = {};
  src.rooms.forEach(r => { const m = db.rooms.find(x => x.name === r.name); if (m) roomMap[r.id] = m.id; else { const id = fresh(db.rooms, r.id); db.rooms.push(Object.assign({}, r, { id })); roomMap[r.id] = id; n.rooms++; } });
  src.teachers.forEach(t => {
    const m = db.teachers.find(x => x.name === t.name);
    if (m) { tMap[t.id] = m.id; return; }
    const id = fresh(db.teachers, t.id);
    db.teachers.push(Object.assign({}, t, { id, roomId: roomMap[t.roomId] || '', reduce: (t.reduce || []).map(r => redMap[r]).filter(Boolean) })); tMap[t.id] = id; n.teachers++;
  });
  /* 班級 */
  src.classes.forEach(c => { if (!db.classes.some(x => x.year === c.year && x.grade === c.grade && +x.classNo === +c.classNo)) { db.classes.push(Object.assign({}, c, { id: fresh(db.classes, c.id) })); n.classes++; } });
  /* 學生 */
  const sMap = {};

    Object.entries(st.supOff || {}).forEach(([g, v]) => { supOff[grpMap[g] || g] = v; });

    db.students.push(Object.assign({}, st, { id, pid: samePerson && samePerson.name !== st.name ? id : st.pid, caseTeacherId: tMap[st.caseTeacherId] || '', sup, supOff }));

const mergeSummary = n => [['教師', n.teachers], ['教室', n.rooms], ['學年度', n.years], ['班級', n.classes], ['學生', n.students], ['課程', n.courses], ['規劃表', n.plans]].filter(([, v]) => v).map(([k, v]) => `${k} ${v}`).join('、') || '沒有新的資料';
function importDialog(nd, fname) {
  const trial = mode => { const c = normalize(JSON.parse(JSON.stringify(fullData()))); return mergeInto(c, JSON.parse(JSON.stringify(nd)), mode); };
  const tA = trial('add'), tB = trial('basic');
  const opt3 = (v, title, desc, on) => `<label class="impopt ${on ? 'on' : ''}"><input type="radio" name="impM" value="${v}" ${on ? 'checked' : ''}><div><span class="it">${title}</span><span>${desc}</span></div></label>`;
  openModal('匯入 JSON', `<p class="desc">檔案「${esc(fname)}」：${nd.years.length} 個學年度、${nd.teachers.length} 位教師、${nd.students.length} 筆學生、${nd.courses.length} 堂課。請選擇匯入方式：</p>
    <div class="impopts">
      ${opt3('replace', '1. 全部覆蓋', `用檔案取代目前全部的資料與設定。<b>目前編輯的內容會被全部蓋掉</b>（會先自動備份）。適合：還原自己匯出的備份。`, false)}
      ${opt3('add', '2. 只新增這裡沒有的資料與設定', `目前的資料都保留，只把這裡還沒有的教師、學生、班級、課程、規劃表，以及科目、障別、支持服務等設定項目加進來。適合：從其他老師那裡拿到 JSON 檔。<br><span class="tag pri">會新增：${esc(mergeSummary(tA))}${tA.cfg ? `；設定項目 ${tA.cfg} 項` : ''}</span>`, true)}
      ${opt3('basic', '3. 只匯入設定與基本資料', `匯入系統設定（模式、節次、科目、障別、教師身分與節數、支持服務…，密碼不會改）與基本資料（教師、教室、班級、學生名單，只新增這裡沒有的）。<b>不匯入排好的課表與間接服務規劃表</b>。<br><span class="tag pri">會新增：${esc(mergeSummary(tB))}</span>`, false)}
    </div>${state.sync.url ? '<div class="banner warn" style="margin-top:10px">目前已連線 Google 試算表：匯入後幾秒會上傳，共用這份試算表的老師都會看到。</div>' : ''}`,
    `<button class="btn" data-close>取消</button><button class="btn pri" id="impOk">匯入</button>`, m => {
      m.querySelector('.impopts').onchange = () => $$('.impopt', m).forEach(l => l.classList.toggle('on', $('input', l).checked));
      $('#impOk', m).onclick = async () => {
        const mode = $('input[name=impM]:checked', m).value;
        if (mode === 'replace' && !await ask('確定用檔案「全部覆蓋」目前的資料？（目前的資料會先自動備份，可在本頁還原）', { ok: '全部覆蓋', danger: true })) return;
        backupLocal('匯入 JSON 前');
        let msg;
        if (mode === 'replace') { setDB(nd); msg = '已全部覆蓋'; }
        else { const full = normalize(JSON.parse(JSON.stringify(fullData()))), r = mergeInto(full, nd, mode); setDB(normalize(JSON.parse(JSON.stringify(full)))); msg = `已匯入：${mergeSummary(r)}${r.cfg && mode === 'add' ? `；設定項目 ${r.cfg} 項` : ''}`; }
        state.year = ''; pickYear(); commit(); closeModal(); renderHeader(); route(); toast(msg, 5000);
        if (mode !== 'replace' && findConflicts().length) notify(`匯入後有 ${findConflicts().length} 個撞課，請到「排課」頁上方查看並調整。`);
      };
    });
}

function pagePassword() {
  let shown = false;

  app.innerHTML = card('目前密碼', '在教室投影時請留意畫面，預設為隱藏。', `

    card('更改密碼', '密碼 4–20 個字元，可以是數字或英文。', `
      <div id="pwForm"><div class="fgrid" style="grid-template-columns:repeat(auto-fill,minmax(200px,1fr))">
        <label class="field"><span>新密碼</span><input id="pwNew" type="password" autocomplete="new-password"></label>
        <label class="field"><span>再輸入一次</span><input id="pwNew2" type="password" autocomplete="new-password"></label></div>
      <div class="row" style="margin-top:12px"><button type="button" id="pwBtn" class="btn pri">更改密碼</button><span class="msg-err" id="pwErr"></span></div></div>`) +

  const paint = () => { $('#pwCur').textContent = shown ? cur() : '•'.repeat(Math.max(4, cur().length)); $('#pwToggle').textContent = shown ? '隱藏' : '顯示'; };
  $('#pwToggle').onclick = () => { shown = !shown; paint(); };
  const submit = () => {
    const a = $('#pwNew').value, b = $('#pwNew2').value, err = $('#pwErr');
    if (a.length < 4 || a.length > 20) return err.textContent = '密碼需要 4–20 個字元';
    if (/\s/.test(a)) return err.textContent = '密碼不能有空白';
    if (a !== b) return err.textContent = '兩次輸入的密碼不一樣';

  };
  $('#pwBtn').onclick = submit;
  $('#pwForm').onkeydown = e => { if (e.key === 'Enter') submit(); };
  $('#pwReset').onclick = async () => {
    if (!await ask(`確定恢復成預設密碼「${DEFAULT_PW}」？`)) return;
    DB.config.adminPassword = DEFAULT_PW; commit(); toast('已恢復預設密碼'); pagePassword();
  };
}

  { cat: 'stu', m: ['se'], q: '什麼是「{OTH}學生」？', a: '{R}學生來{S}上課，但個管老師在{R}，不是{S}老師的個管學生。如果{R}也使用這個系統，在{R}模式建立的學生會自動出現在這裡；沒有的話，新增學生時類別選「{OTH}學生」，可以填他在{R}的個管老師與分機。排課時一樣可以勾選、也會檢查撞課；不算入個管人數，名冊與授課節數一覽預設不列出（勾選才會顯示）。' },
  { cat: 'stu', m: ['se'], q: '{S}學生的班級怎麼填？不同年級一起上課怎麼辦？', a: '學生資料填「所屬{S}」（例如 甲班）並標年級。排課時可以直接勾不同年級的學生一起上課，課表上的年級標示會自動寫成像「G1.6」。' },
  { cat: 'stu', q: '考試評量服務、專業團隊、酌減人數要記在哪裡？', a: '在「個管學生」按「編輯」，展開「特殊教育支持服務」勾選即可（需要填分鐘數的項目直接在空格打數字）。組別與項目可在「系統設定 → 班別與規則 → 特殊教育支持服務」新增或修改。前台「個管學生名冊」切換到「支持服務一覽」可以列出全部、篩選某一種服務並下載 PDF。' },
  { cat: 'stu', m: ['rr', 'se'], q: '障礙亞型、鑑定期限要在哪裡填？', a: '在「個管學生」編輯學生，選了障別就會出現可以勾選的亞型（例如學習障礙的讀寫障礙），鑑定期限從下拉選單選（沒有的選「其他」自己打）。亞型與鑑定期限的選項可在「系統設定 → 班別與規則 → 鑑定資料：障礙亞型與鑑定期限」修改。' },
  { cat: 'stu', m: ['rr', 'gt'], q: '雙重殊異的學生（同時有資優與身障身分）怎麼記？', a: '在「個管學生」編輯這位學生，勾「雙重殊異」，再選第二個身分，填另一邊的個管教師（例如資優班系統填資源班的個管教師）。學生仍算這個系統的個管學生，名冊、學生課表、授課時數都會顯示「雙殊」和兩位個管教師。' },
  { cat: 'stu', q: '新學年度要怎麼升級學生？', a: '約 6 月在「個管學生」按「學年度升級」：會自動新增下一個學年度，學生升一個年級，最高年級自動移除；會重新編班的年級（在「學校與介面」設定，國小預設 3、5 年級）班級會留白，切到新學年度後勾「只看未填班級」補上。「班級與教師」可以按「從上一學年帶入班級」。開學前到「學年度」把新學年度「設為目前」。' },
  { cat: 'stu', q: '鑑輔會沒有核定、但觀察後需要的支持服務（或鑑輔會有核定但沒提供）要怎麼記？', a: '在學生「編輯 → 特殊教育支持服務」裡，每一項都有兩格：「鑑輔會核定」和「實際提供」。勾鑑輔會核定時會自動勾實際提供；觀察後沒有提供就把實際提供取消，鑑輔會沒給但實際有給就只勾實際提供。疑似生沒有鑑輔會核定，只能勾實際提供。「支持服務一覽」會把兩邊不同的項目註記(實務)或(未提供)，篩選器也可以選「鑑輔會核定與實際提供不同」一次列出來；考試評量等名單以實際提供為準。' },
  { cat: 'sch', q: '排課前要怎麼列出學生需要的課、做能力分組和配課？', a: '到「排課作業 → 需求與分組」：①學生課程需求：每位學生一列，點格子切換抽離或外加（節數之後再決定）；②能力分組：選一個領域，左邊列出還沒分組的學生，勾選後按「新增一組」，再填每週節數、選教室與授課教師；③配課：一次檢視所有分組的節數與老師，下方會加總每位老師的配課節數，和基本節數、超鐘點比較。範圍可以選「全部教室」或某一間教室，別間教室的學生也可以加進你的組。三張表都能下載 PDF、Word。' },
  { cat: 'sch', q: '同一個領域要分開上、學生又會重疊（例如功能性動作分大肢體、小肢體，學習策略依主題分組）怎麼分組？', a: '所有領域都可以這樣做。在「② 能力分組」建兩組，分組卡片組名旁的「細項／主題」分別填「大肢體」「小肢體」。不同細項的組可以放相同的學生（例如 A 生同時在兩組），組名會自動變成「G3功能性動作訓練(大肢體)-外」，排課時科目也會帶入「功能性動作訓練(大肢體)」。需求表還是只勾「功能性動作訓練」。不需要分細項就留白。' },
  { cat: 'sch', q: '這學期課表已經排好了，才開始做需求與分組，要重新排課嗎？', a: '不用。在「需求與分組」的「② 能力分組」或「③ 配課」按「比對現有課表」，會用學生名單把課表上的課對應到分組：名單完全相同的一鍵全部對應；兩個細項學生一樣時讓你選；學生重疊一半以上的列為「差不多」，可以先對應，名單差異再到「分組與課表對照」處理。有細項的組可以一併把科目改成「學習策略(閱讀理解)」這種名稱。' },
  { cat: 'sch', q: '隔壁教室沒有做需求與分組，學生跨教室上課會不會被檢核卡住？', a: '不會。隔壁班的學生來你的組上課，沒有填需求也不會被提醒；你的學生到隔壁教室上課，只要課表上已經有那間教室老師的這一科，就會自動視為「到其他教室上課」，不算未分組。那間教室還沒排課時，可以在「② 能力分組」的「還沒分組」清單，用學生旁的「外班…」先標示要到哪一間教室上，對照清單只會列為提醒。' },
  { cat: 'sch', q: '分好組之後，排課時怎麼用？', a: '「排課」頁上方有「分組排課進度」，每一組顯示已排／應排節數（綠色排滿、黃色還差、紅色還沒排）。點一組會開新課程並帶入科目、類型、老師、學生與教室，只要點選上課時段就好；視窗裡也會顯示「這一組每週幾節、還差幾節」。一般的新增課程視窗最上面也可以「從分組帶入」。之後分組的學生有異動，到分組卡片按「學生名單更新到已排的課」。' },
  { cat: 'stu', q: '鑑定期限的選項可以改嗎？', a: '可以。到「系統設定 → 班別與規則 → 鑑定資料：障礙亞型與鑑定期限」，右邊每行打一個選項（預設是國小二年級、國小六年級、國中七年級）。學生資料裡沒有的期限可以選「其他（自行輸入）」。' },
  { cat: 'stu', q: '學生學期中轉學出去要怎麼處理？', a: '在「個管學生」那一列最右邊按「轉出」（或按「編輯」，在視窗最下方的「轉學（轉出）」按「辦理轉出」），填轉出日期與說明（例如轉入的學校）。學生資料會保留，但會從課表移除，不再出現在排課名單、課表查詢、授課節數與人力計算；名冊預設不列出，勾「列出已轉出學生」才會顯示（標示「已轉出」與日期）。如果學生又轉回來，按「取消轉出」，系統會試著把他放回原本的課。' },
  { cat: 'stu', q: '學生結案（不再接受服務）要怎麼處理？', a: '想保留紀錄可以用「轉出」，在說明寫「結案」；確定不需要保留時，在「個管學生」刪除這位學生，刪錯可以馬上按「復原」。他在其他學年度的資料不受影響。' },
  // 排課
  { cat: 'sch', q: '同一門課一週上好幾節（例如國語抽離 5 節）要一節一節建立嗎？', a: '不用。新增課程時展開「上課時段」小課表，一次點選 5 格再儲存，就會排好 5 節。之後點其中任何一節修改，預設「一起修改相同的課」，改老師、學生或增減時段都會一起更新。' },
  { cat: 'sch', q: '只想改其中一節，或把一節搬到別的時段？', a: '點開那一節，取消勾選「一起修改相同的課」，就只會改這一節；在小課表上取消原本的格子、點新的格子再儲存，就是搬到新時段。' },
  { cat: 'sch', q: '「複製課程」怎麼用？', a: '在課程視窗按「複製課程」，會用目前的設定開一門新課程（時段是空的），選好時段、改一下科目或學生就可以儲存，例如同一組學生的數學課。' },
  { cat: 'sch', q: '為什麼有學生不能勾選？小課表上的「有課」「撞課」是什麼？', a: '學生名單上標「已排」表示他在選的時段已經有別的課，系統會避免撞課，請先調整原本那堂課。小課表上「有課」表示老師這節已經有別的課；「撞課」表示有學生這節已經有別的課，選了會無法儲存。' },
  { cat: 'sch', q: '同一節兩位老師在同一間教室？協同教學怎麼排？', a: '各上各的課：分開建立兩堂課，教室課表會放在同一格、用兩位老師的顏色區分。協同教學：在同一堂課選兩位以上授課教師，課表會標「協同」；協同教學怎麼算節數，可在「班別與規則」選。' },
  { cat: 'sch', m: ['se'], q: '兩班合班上課怎麼排？', a: '建立一堂課，把兩班的老師都選進來（最多 4 位也可以）、兩班的學生都勾，教室選上課的那一間。課表上會標示合班。' },
  { cat: 'sch', m: ['se'], q: '{S}學生到普通班上融合課（英語、美勞、體育…）怎麼排？', a: '新增課程時，課程類型選「融合（到普通班上課）」，填到哪一班上課、普通班授課老師（可不填）。融合課會出現在學生課表、班級課表，算在學生節數與撞課檢查，但不算特教老師的授課節數；陪同的特教老師可以不選。' },
  { cat: 'sch', m: ['rr', 'gt'], q: '入班支援的課怎麼排？', a: '課程類型選「入班」，上課教室選「入班（至學生原班）」。入班節數會算在學生的服務節數與老師的授課節數。' },
  { cat: 'sch', m: ['rr', 'gt'], q: '間接服務要怎麼排進課表？', a: '新增課程時「課程類型」選「間接服務」，勾選服務類別與學生。間接服務只是代表時段，不受綁課限制：學生同一節在上別的課也可以勾選，也不會擋住其他課程；學生個人課表與班級課表不會顯示這一節。' },
  { cat: 'sch', q: '課程類型（抽離、外加）是怎麼決定的？', a: '預設「依節次自動」：依「系統設定 → 學校與介面 → 節次設定」裡每一節的類型（例如早自習是外加、第 1 節是抽離）。有例外時在課程裡直接選抽離、外加或入班。' },
  { cat: 'sch', q: '老師的節數怎麼檢查？超過了一定要調整嗎？', a: '「排課」上方選一位老師，會顯示基本節數還缺幾節、超鐘點、合計。要算超鐘點的課，在課程裡勾「計入超鐘點」。超過時會提醒但不強制調整；人力安排不得已時可以按「關掉這位老師的提醒」。各身分的基本節數與超鐘點上限在「班別與規則」設定。' },
  { cat: 'sch', q: '老師有減授（例如擔任召集人）怎麼設定？', a: '先在「系統設定 → 班別與規則 → 減授鐘點」設定原因和節數，再到「基本資料 → 班級與教師」編輯老師、勾選減授原因，基本節數會自動扣掉。' },
  // 課表與列印
  { cat: 'view', q: '怎麼一次印很多張課表？', a: '前台「課表查詢」選「一次選多張」，展開清單勾選要輸出的老師、教室、學生或班級（學生可以先選個管教師，一次印出他所有的個管學生），一張一頁。預覽一次只顯示一張，可以按上一張／下一張、輸入頁數或用鍵盤左右鍵換頁。' },
  { cat: 'view', m: ['rr', 'gt'], q: '要給普通班導師的課表用哪一種？', a: '同一班有 2 位以上個管學生時用「班級學生課表」：每節寫出上課學生、授課老師與教室，下方列出本班學生的個管老師與分機。只有 1 位時用「學生課表」。' },
  { cat: 'view', m: ['se'], q: '{S}的全班課表在哪裡？', a: '「課表查詢 → 班級」就是每個{S}的全班課表，分組上課時會列出每組的老師與學生。' },
  { cat: 'view', q: '課表上的分機怎麼顯示？', a: '課表查詢勾「顯示分機」（只記在自己的裝置）。分機在「基本資料 → 班級與教師」填在老師身上，教室的分機會自動列出使用這間教室的老師；普通班導師的分機填在班級上。' },
  { cat: 'view', q: '可以下載 Word 嗎？字體、直式橫式可以選嗎？', a: '前台查詢的課表、名冊、支持服務一覽、授課節數一覽、間接服務規劃表、人力申請表都可以下載 PDF 或 Word（Word 裡的表格可以再修改）。右上可選芫荽體或標楷體、直式或橫式，系統會記住上次的選擇。' },
  { cat: 'view', q: '課表上有些字為什麼比較小？', a: '課表方塊裡的每一行都會排在同一行，放不下時會先把行尾括號（例如「(疑似)」）縮小，再把整行縮小，印出來比較整齊；只有間接服務的課名可以換行。手機畫面的預覽格子太小時仍會換行，但下載的 PDF 會排成一行。' },
  { cat: 'view', q: '名冊和支持服務一覽的欄位可以調整嗎？', a: '可以。到「系統設定 → 學校與介面 → 名冊與一覽表的欄位」勾選要顯示的欄位與順序。' },
  // 節數與正式表件
  { cat: 'hours', q: '課表改了，時數要重算嗎？', a: '不用。授課時數、課表、規劃表、人力申請表都是依排課資料即時計算。' },
  { cat: 'hours', q: '授課節數一覽裡，老師的節數是怎麼算的？', a: '老師那一列的節數就是老師課表上的節數：同一節教好幾位學生只算 1 節，也包含來上課的非個管學生，和「教師課表」下方的每週授課節數相同。學生那幾列右邊的「合計」是每位學生每週上課的節數。' },
  { cat: 'hours', m: ['rr', 'gt'], q: '間接服務規劃表怎麼填？可以沿用去年的嗎？', a: '到「排課作業 → 間接服務規劃」，每位個管教師每學年一份，排好就用一整年；表上的學期可選（送審通常寫第 1 學期）。新學年可以按「複製上一學年度」再微調，也可以下載 PDF 或 Word。表下半部的勾選項目在「系統設定 → 教育局表件」修改。' },
  { cat: 'hours', m: ['rr', 'gt'], q: '規劃表和課表對不上會怎樣？', a: '規劃表有、課表沒有排間接服務時段（或反過來）時，「時數計算」與「間接服務規劃」頁上方會列出是哪位學生的哪一類服務，照提示到「排課」或規劃表補上即可。' },
  { cat: 'hours', m: ['rr', 'se'], q: '人力申請表什麼時候填？資料從哪裡來？', a: '教育局約在每年 5 月公布下一學年度的「彈性調整國小身心障礙類特殊教育班教師人力實施計畫」，學校在本學年第 2 學期依第 2 學期的課表填寫。到「排課作業 → 人力申請表」，系統會用目前檢視學年度的課表與學生資料自動試算，新鑑定個案與特別加分直接在表上填寫，再展開「檢核結果」看是否符合申請支援條件、是否達調整標準。前台也可以查看。' },
  { cat: 'hours', m: ['rr', 'se'], q: '新的人力實施計畫公布了，要改哪裡？', a: '到「系統設定 → 教育局表件 → 人力計分標準」按「新增學年度」，複製一份再依新計畫逐項修改數字。還沒建立時，人力申請表上方會提醒目前暫用哪一年的標準。' },
  { cat: 'hours', m: ['rr'], q: '這學期新鑑定的學生、5 年級疑似生要怎麼處理？', a: '在人力申請表下方的「學生明細」把新鑑定的學生改為「新鑑定個案」（改算每人 1 分、不計節數）；5 年級疑似生若未參加在校生鑑定、或疑似生已超過兩年，改為「不計分」。檢核結果會把 5 年級疑似生、每週 10 節以上、入班超過 6 節的學生標出來。' },
  { cat: 'hours', m: ['rr'], q: '授課節數一覽的「顯示人力計分」是什麼？', a: '勾選後，授課節數一覽最後面會列出每位老師的（個管學生上自己的課＋非個管學生上自己的課）人次節 × 每節分數，協同教學由老師平分。完整的申請表試算請看「人力申請表」。' },

function scheduleOptions(mode) {
  if (mode === 'teacher') return sortedTeachers().filter(t => yCourses().some(c => hasT(c, t.id))).map(t => [t.id, t.name]);
  if (mode === 'room') return DB.rooms.map(r => [r.id, r.name]);
  if (mode === 'student') return yStudents().sort(sortStu).map(s => [s.id, `${classLabel(s)} ${N(s)}`]);
  return multiClasses().map(c => [c.key, `${c.label}（${c.students.length} 人）`]);
}
function scheduleSheetFor(mode, id, dis) {
  if (!id) return '';
  if (mode === 'teacher') return teacherSheet(id, dis);
  if (mode === 'room') return roomSheet(id);
  if (mode === 'student') return studentSheet(id);
  const cl = multiClasses().find(c => c.key === id); return cl ? classSheet(cl, dis) : '';
}

  if (!u.tid || !T(u.tid)) u.tid = (ts.find(t => yStudents().some(s => s.caseTeacherId === t.id)) || ts[0] || {}).id || '';
  if (!u.tid) { app.innerHTML = card('間接服務規劃', '', '<div class="empty">請先到「班級與教師」新增教師</div>'); return; }

  const prev = prevYearPlan(u.tid);
  app.innerHTML = card('間接服務規劃', `每位個管教師<b>每學年一份</b>，排好後整年使用，有特殊狀況直接修改即可。格式與學校的「${esc(OWN())}間接服務規劃表」相同：直接在表上用下拉選單加入學生、勾選具體作法、在空格填寫。課表上排入的「間接服務」時段會和這份規劃比對。`, `
    <div class="row"><select id="plT" aria-label="規劃者">${teacherOpts(u.tid)}</select><label class="row" style="gap:6px" title="只影響表格標題上印的學期；送教育局審查時通常寫第 1 學期">表上學期<select id="plS" aria-label="表上學期">${opt('1', '第 1 學期', cur.sem)}${opt('2', '第 2 學期', cur.sem)}</select></label>
    <label class="row" style="gap:6px" title="勾選時規劃表一律寫成「王生」；不勾時依上方「姓名」的設定"><input type="checkbox" id="plM" ${cur.mask ? 'checked' : ''}> 姓名寫成「王生」</label>
    ${cur._draft ? '<span class="tag warn">尚未填寫</span>' : '<span class="tag ok">已儲存</span>'}</div>
    <div class="row"><span class="grow"></span>${fontSeg()}${prev ? `<button class="btn" data-act="copyPrev">複製${esc(prev.label)}</button>` : ''}<button class="btn" data-act="print">列印</button><button class="btn" data-act="word">下載 Word</button><button class="btn pri" data-act="pdf">下載 PDF</button></div>`)
    + `<div id="plIssues"></div><div class="preview" id="plRes"></div>`;
  const related = () => yStudents().filter(s => s.caseTeacherId === u.tid || Object.values(cur.items || {}).some(a => (a || []).includes(s.id)));
  const render = () => {
    $('#plRes').innerHTML = planFormSheet(cur, true);
    $('#plIssues').innerHTML = issuesBanner(related());
  };
  const save = (again = true) => { ensurePlan(cur); commit(); if (again) render(); const tag = $('.card .tag.warn'); if (tag) { tag.className = 'tag ok'; tag.textContent = '已儲存'; } };
  render();
  app.oninput = e => {
    const t = e.target;
    if (t.dataset.pa && t.type !== 'checkbox') {
      cur.answers[t.dataset.pa] = t.value;
      const base = t.dataset.pa.replace(/b\d+$/, ''), cb = $(`input[type=checkbox][data-pa="${base}"]`);
      if (t.value.trim() && cb && !cb.checked) { cb.checked = true; cur.answers[base] = true; }
      t.size = Math.max(5, [...t.value].length * 2 + 1);
    }
  };
  app.onchange = e => {
    const t = e.target;
    if (t.id === 'plT') { u.tid = t.value; return pagePlan(); }
    if (t.id === 'plS') { cur.sem = t.value; return save(); }
    if (t.id === 'plM') { cur.mask = t.checked; return save(); }
    if (t.dataset.pa) { cur.answers[t.dataset.pa] = t.type === 'checkbox' ? t.checked : t.value; return save(false); }
    if (t.dataset.pf) { cur[t.dataset.pf] = t.dataset.pf === 'weekly' ? String(parseInt(t.value, 10) >= 0 ? parseInt(t.value, 10) : '') : t.value.trim(); return save(); }
    if (t.dataset.padd) { if (!t.value) return; const ty = t.dataset.padd; cur.items[ty] = [...new Set([...(cur.items[ty] || []), t.value])]; return save(); }
  };
  app.onclick = async e => {
    const x = e.target.closest('[data-prm]');
    if (x) { const ty = x.dataset.prm; cur.items[ty] = (cur.items[ty] || []).filter(id => id !== x.dataset.sid); return save(); }
    const a = e.target.closest('[data-act]'); if (!a) return;
    if (a.dataset.act === 'copyPrev' && prev) {
      if (!await ask(`把「${prev.label}」的規劃表內容複製到本學年這一份？\n（服務對象會對應到本學年的學生；目前這份的內容會被取代）`, { ok: '複製' })) return;
      const map = id => { const o = DB.students.find(s => s.id === id); if (!o) return null; const n = yStudents().find(s => s.pid === o.pid); return n ? n.id : null; };
      const items = {}; Object.entries(prev.p.items || {}).forEach(([ty, a2]) => { items[ty] = (a2 || []).map(map).filter(Boolean); });
      Object.assign(cur, { items, answers: JSON.parse(JSON.stringify(prev.p.answers || {})), weekly: prev.p.weekly, room: prev.p.room, planner: prev.p.planner, mask: prev.p.mask });
      save(); toast('已複製，請檢查後再調整'); return pagePlan();
    }
    const t = T(u.tid), pg = [planFormSheet(cur, false)];
    const fn = `第${cur.sem}學期_間接服務規劃表_${t ? t.name : ''}`;
    if (a.dataset.act === 'pdf') exportPDF(pg, { filename: fileName(fn), orientation: 'portrait', fit: false });
    if (a.dataset.act === 'word') download(planDocx([cur]), fileName(fn).replace(/\.pdf$/, '') + '.docx');
    if (a.dataset.act === 'print') printPages(pg, 'portrait');
  };
}

function pageYears() {
  const ys = [...DB.years].sort((a, b) => +b.id - +a.id);
  const rows = ys.map(y => {
    const ns = DB.students.filter(s => s.year === y.id).length, nc = DB.courses.filter(c => c.year === y.id).length;
    const cur = y.id === DB.config.currentYear;
    return `<tr data-id="${esc(y.id)}"><td><b>${esc(y.id)}</b> 學年度 ${cur ? '<span class="tag ok">目前學年度</span>' : ''}</td><td class="c">${ns}</td><td class="c">${nc}</td>
      <td><input data-f="note" value="${esc(y.note)}" placeholder="備註" class="w-l"></td>
      <td><div class="row">${cur ? '' : '<button class="btn sm" data-act="cur">設為目前</button>'}<button class="btn sm" data-act="view">切換檢視</button><button class="btn sm danger" data-act="del">刪除</button></div></td></tr>`;
  }).join('');
  /* 沒有學年度時依今天推算：8 月起算新學年（民國年） */
  const now = new Date(), rocYear = now.getFullYear() - 1911 - (now.getMonth() < 7 ? 1 : 0);
  const next = ys.length ? +ys[0].id + 1 : rocYear;
  app.innerHTML = card('學年度', '每個學年度有各自的學生名單、班級與課表。「目前學年度」是大家打開網頁時預設看到的年度。', `
    <div class="row"><input type="number" id="newY" value="${next}" class="w-s" aria-label="學年度"><button class="btn pri" data-act="add">新增學年度</button></div>
    <div class="scroll" style="margin-top:12px"><table class="tbl"><thead><tr><th>學年度</th><th class="c">學生</th><th class="c">課程</th><th>備註</th><th>操作</th></tr></thead>
    <tbody>${rows || '<tr><td colspan="5" class="empty">尚未建立學年度</td></tr>'}</tbody></table></div>`) +

    card('升級到新學年度', `學生年級一次加 1，${G_MAX()} 年級自動畢業不複製；升上 ${gradeTxt(REGROUP())}會重新編班，班級自動留白；其他年級沿用原班級（可在「學校與介面」修改）。`, `<button type="button" class="btn" data-go="a/students">前往「個管學生」→ 學年度升級</button>`);
  app.onclick = async e => {
    const a = e.target.closest('[data-act]'); if (!a) return;
    const id = (a.closest('tr') || {}).dataset?.id;
    if (a.dataset.act === 'add') {
      const v = String(parseInt($('#newY').value, 10) || '');
      if (!v) return toast('請輸入學年度數字');
      if (DB.years.some(y => y.id === v)) return toast('這個學年度已經存在');
      DB.years.push({ id: v, note: '' });
      const first = !DB.config.currentYear;
      if (first) DB.config.currentYear = v;
      commit();
      /* 已經有目前學年度時，新增的年度先不自動切換（避免畫面突然變空） */
      if (first || await ask(`已新增 ${v} 學年度。要切換到 ${v} 學年度檢視嗎？\n（新學年度還沒有學生和課表；要把學生帶過去請用「個管學生 → 學年度升級」）`, { ok: `切換到 ${v}`, cancel: `留在 ${state.year}` })) state.year = v;
      renderHeader(); pageYears(); toast(`已新增 ${v} 學年度`);
    }
    if (a.dataset.act === 'cur') { DB.config.currentYear = id; commit(); renderHeader(); pageYears(); }
    if (a.dataset.act === 'view') { state.year = id; renderHeader(); toast(`正在檢視 ${id} 學年度`); }
    if (a.dataset.act === 'del') {
      const ns = DB.students.filter(s => s.year === id).length, nc = DB.courses.filter(c => c.year === id).length;
      if (!await ask(`確定刪除 ${id} 學年度？\n這會一併刪除該年度的 ${ns} 位學生資料、${nc} 堂課程與班級設定，且無法復原。`)) return;
      DB.years = DB.years.filter(y => y.id !== id);
      ['students', 'courses', 'classes', 'plans'].forEach(t => DB[t] = DB[t].filter(r => r.year !== id));
      if (DB._hid) ['students', 'courses', 'plans'].forEach(t => { DB._hid[t] = DB._hid[t].filter(r => r.year !== id); });
      if (DB.config.currentYear === id) DB.config.currentYear = (DB.years.map(y => y.id).sort((a, b) => +a - +b).pop() || '');
      pickYear(); commit(); renderHeader(); pageYears();
    }
  };
  app.onchange = e => {
    const tr = e.target.closest('tr'); if (e.target.dataset.f === 'note' && tr) { DB.years.find(y => y.id === tr.dataset.id).note = e.target.value; commit(); }
  };
}

    card(`普通班級（${Y()} 學年度）`, '建立全校班級與導師，學生資料可直接選班級，名冊也會顯示導師。', `
      <div class="row">${GRADES().map(g => `<label class="field"><span>${g} 年級班數</span><input type="number" min="0" max="30" class="w-xs" id="gc${g}" value="${cls.filter(c => c.grade === g).length || ''}"></label>`).join('')}
      <button class="btn pri" data-act="genC" style="align-self:flex-end">產生班級</button>${prevYear() && DB.classes.some(c => c.year === prevYear()) ? `<button class="btn" data-act="copyC" style="align-self:flex-end">從 ${prevYear()} 學年度帶入班級</button>` : ''}</div>
      <div class="row"><select id="nCg">${gradeOpts(1)}</select><input id="nCn" class="w-xs" placeholder="班號" inputmode="numeric"><input id="nCh" class="w-m" placeholder="導師（可空白）"><input id="nCe" class="w-xs" placeholder="分機"><button class="btn" data-act="addC">新增單一班級</button></div>
      ${cls.length > 6 ? `<div class="row" style="margin-top:10px"><input id="cFind" class="w-l" placeholder="🔍 搜尋班級、導師或分機" aria-label="搜尋班級、導師或分機"></div>` : ''}
      <div class="scroll" style="margin-top:12px"><table class="tbl" id="clsTbl"><thead><tr><th>班級</th><th>導師</th><th>分機</th><th class="c">個管學生</th><th></th></tr></thead>
      <tbody>${cRows || '<tr><td colspan="5" class="empty">尚未建立班級</td></tr>'}</tbody></table></div>`);

  app.onclick = async e => {
    const a = e.target.closest('[data-act]'); if (!a) return;
    const act = a.dataset.act, tr = a.closest('tr');
    if (act === 'addT') {
      const name = $('#nT').value.trim(); if (!name) return toast('請輸入教師姓名');
      if (DB.teachers.some(t => t.name === name) && !await ask(`已經有一位「${name}」老師了，確定還要再新增一位同名的老師？`, { ok: '仍要新增' })) return;
      const color = normHex($('#nTh').value);
      if (!color) return toast('色號格式不正確，請輸入像 #b3cee5 的 6 碼色號');
      DB.teachers.push({ id: uid(), name, role: $('#nTr').value, roomId: DB.rooms.length === 1 ? DB.rooms[0].id : '', ext: '', color, hrT: $('#nThr').checked, baseHours: '', noLoadWarn: false });
      commit(); pageOrg(); $('#nT').focus();
    }
    if (act === 'delT') {
      const id = tr.dataset.t, t = T(id);
      const nc = DB.courses.filter(c => hasT(c, id)).length, ns = DB.students.filter(s => s.caseTeacherId === id).length;
      if (!await ask(`確定刪除「${t.name}」？${nc || ns ? `\n此教師有 ${nc} 堂課、${ns} 筆個管學生資料，刪除後這些欄位會變成「未指定」。` : ''}`)) return;
      DB.teachers = DB.teachers.filter(x => x.id !== id);
      DB.courses.forEach(c => { c.teacherIds = cT(c).filter(x => x !== id); });
      DB.students.forEach(s => { if (s.caseTeacherId === id) s.caseTeacherId = ''; });
      commit(); pageOrg();
    }
    if (act === 'addR') {
      const name = $('#nR').value.trim(); if (!name) return toast('請輸入教室名稱');
      const room = { id: uid(), name, ext: '' };
      DB.rooms.push(room); commit(); pageOrg();
      /* 先建老師、後建教室時，老師都還沒有教室：問要不要一起指定 */
      const noRoom = DB.teachers.filter(t => !t.roomId);
      if (noRoom.length && await ask(`有 ${noRoom.length} 位老師還沒有指定教室（${noRoom.map(t => t.name).join('、')}）。\n要把他們都指定到「${name}」嗎？\n（課程的教室預設跟著第一位授課老師；沒有教室的話，教室課表會是空的）`, { ok: '都指定到這間', cancel: '之後再個別設定' })) {
        noRoom.forEach(t => { t.roomId = room.id; }); commit(); pageOrg(); toast(`已指定 ${noRoom.length} 位老師到「${name}」`);
      }
    }
    if (act === 'editT') return teacherEditModal(T(tr.dataset.t));
    if (act === 'delR') {
      const id = tr.dataset.r; if (!await ask('確定刪除這間教室？使用這間教室的課程會變成「未指定教室」。')) return;
      DB.rooms = DB.rooms.filter(r => r.id !== id);
      DB.courses.forEach(c => { if (c.roomId === id) c.roomId = ''; });
      DB.teachers.forEach(t => { if (t.roomId === id) t.roomId = ''; });
      commit(); pageOrg();
    }
    if (act === 'copyC') {
      const py = prevYear(), old = DB.classes.filter(c => c.year === py);
      const rg = REGROUP();
      if (!await ask(`從 ${py} 學年度帶入班級到 ${Y()} 學年度：\n・升上 ${gradeTxt(GRADES().slice(1).filter(g => !rg.includes(g)))}：沿用班號與導師\n・升上 ${gradeTxt(rg)}（重新編班）：建立相同班數，導師留白\n・${G_MIN()} 年級：建立與去年相同班數，導師留白\n已存在的班級不會重複建立。`, { ok: '帶入' })) return;
      let n = 0;
      const add = (g, no, hr, ext) => { if (!DB.classes.some(x => x.year === Y() && x.grade === g && +x.classNo === +no)) { DB.classes.push({ id: uid(), year: Y(), grade: g, classNo: String(+no), homeroom: hr, ext: ext || '' }); n++; } };
      old.forEach(c => { const keep = !rg.includes(c.grade + 1); if (c.grade < G_MAX()) add(c.grade + 1, c.classNo, keep ? c.homeroom : '', keep ? c.ext : ''); if (c.grade === G_MIN()) add(G_MIN(), c.classNo, '', ''); });
      commit(); pageOrg(); toast(`已帶入 ${n} 個班級，請更新導師`);
    }
    if (act === 'genC') {
      let n = 0;
      for (const g of GRADES()) {
        const cnt = parseInt($('#gc' + g).value, 10) || 0;
        for (let c = 1; c <= cnt; c++) if (!DB.classes.some(x => x.year === Y() && x.grade === g && +x.classNo === c)) { DB.classes.push({ id: uid(), year: Y(), grade: g, classNo: String(c), homeroom: '' }); n++; }
      }
      commit(); pageOrg(); toast(n ? `已新增 ${n} 個班級` : '班級都已存在');
    }
    if (act === 'addC') {
      const g = +$('#nCg').value, c = String(parseInt($('#nCn').value, 10) || '');
      if (!c) return toast('請輸入班號');
      if (DB.classes.some(x => x.year === Y() && x.grade === g && +x.classNo === +c)) return toast('這個班級已經存在');
      DB.classes.push({ id: uid(), year: Y(), grade: g, classNo: c, homeroom: $('#nCh').value.trim(), ext: $('#nCe').value.trim() }); commit(); pageOrg();
    }
    if (act === 'delC') { DB.classes = DB.classes.filter(c => c.id !== tr.dataset.c); commit(); pageOrg(); }
  };
  /* 輸入框按 Enter 直接新增 */
  app.onkeydown = e => {
    if (e.key !== 'Enter' || e.isComposing) return;
    const map = { nT: 'addT', nR: 'addR', nCn: 'addC', nCh: 'addC', nCe: 'addC' }, act = map[e.target.id];
    if (act) { e.preventDefault(); const b = app.querySelector(`[data-act="${act}"]`); if (b) b.click(); }
  };
  app.oninput = e => {
    const t = e.target, tr = t.closest('tr');
    if (t.dataset.f === 'color' && tr) { const hx = $('[data-f=colorHex]', tr); if (hx) { hx.value = t.value; hx.classList.remove('bad'); } }
    if (t.dataset.f === 'colorHex') t.classList.toggle('bad', !!t.value && !normHex(t.value));
    if (t.id === 'nTc') { $('#nTh').value = t.value; $('#nTh').classList.remove('bad'); }
    if (t.id === 'cFind') { const q = t.value.trim(); $$('#clsTbl tr[data-c]').forEach(r => { const txt = r.cells[0].textContent + ' ' + [...r.querySelectorAll('input')].map(i => i.value).join(' '); r.style.display = !q || txt.includes(q) ? '' : 'none'; }); }
    if (t.id === 'nTh') { const h = normHex(t.value); t.classList.toggle('bad', !!t.value && !h); if (h) $('#nTc').value = h; }
  };
  app.onchange = async e => {
    const t = e.target, f = t.dataset.f, tr = t.closest('tr'); if (!f || !tr) return;
    const rec = tr.dataset.t ? T(tr.dataset.t) : tr.dataset.r ? R(tr.dataset.r) : DB.classes.find(c => c.id === tr.dataset.c);
    if (!rec) return;
    if (f === 'color' || f === 'colorHex') {
      const h = normHex(t.value);
      if (!h) { t.classList.add('bad'); toast('色號格式不正確，請輸入像 #b3cee5 的 6 碼色號'); return; }
      rec.color = h; commit();
      $('[data-f=color]', tr).value = h; const hx = $('[data-f=colorHex]', tr); hx.value = h; hx.classList.remove('bad');
      return;
    }
    if (f === 'hrT') { rec.hrT = t.checked; commit(); pageOrg(); toast(`${rec.name}：${dutyText(rec)}`); return; }
    if (f === 'baseHours' || f === 'otHours') {
      const v = t.value.trim();
      if (v && numOrNull(v) === null) { t.classList.add('bad'); toast('節數請填數字，或留白（依身分）'); return; }
      rec[f] = v ? String(numOrNull(v)) : ''; commit(); pageOrg(); return;
    }
    const oldRoom = rec.roomId;
    rec[f] = t.value.trim ? t.value.trim() : t.value;
    commit();
    if (f === 'roomId' && tr.dataset.t) await moveTeacherCourses(rec, oldRoom);
    if (f === 'roomId' || f === 'role') pageOrg();
  };
}

function disOpts(sel) {
  const list = disList().map(d => d.name);
  if (sel && !list.includes(sel)) list.push(sel);
  return opt('', '—', sel) + list.map(n => opt(n, n, sel)).join('');
}
const GOING = ['', '回家', '安親班', '其他'];
/* 放學去向選「其他」時，旁邊出現輸入格，直接存打的內容（例：爺爺家）；沒打字就存「其他」 */
const goingOther = v => !!v && !['回家', '安親班'].includes(v);
const goingSel = v => goingOther(v) ? '其他' : (v || '');
const goingTxt = v => goingOther(v) && v !== '其他' ? v : '';
const GOING_PH = '要去哪裡？例：爺爺家、社區據點';
function goingHTML(id, v) { return `<select id="${id}">${GOING.map(g => opt(g, g || '—', goingSel(v))).join('')}</select><input id="${id}o" class="going-o" value="${esc(goingTxt(v))}" placeholder="${GOING_PH}" aria-label="放學去向（其他）"${goingOther(v) ? '' : ' hidden'}>`; }
function goingWire(m, id) { const sel = $('#' + id, m), inp = $('#' + id + 'o', m); sel.addEventListener('change', () => { inp.hidden = sel.value !== '其他'; if (!inp.hidden) inp.focus(); }); }
const goingVal = (m, id) => { const v = $('#' + id, m).value; return v === '其他' ? ($('#' + id + 'o', m).value.trim() || '其他') : v; };
/* 特教班班別的輸入提示（已用過的班別） */
const homeList = () => `<datalist id="homeL">${[...new Set(DB.students.map(x => x.homeClass).filter(Boolean))].sort().map(h => `<option value="${esc(h)}">`).join('')}</datalist>`;
const homePH = () => isSE() ? '例：甲班' : `例：${KS()} 甲班`;
function stuRow(s) {
  return `<tr data-id="${s.id}" class="${s.left ? 'leftrow' : ''}">
    <td><select data-f="grade">${[...new Set([...GRADES(), s.grade])].filter(Boolean).sort((a, b) => a - b).map(g => opt(g, g + '年', s.grade)).join('')}</select></td>
    <td>${usesHome(s) ? `<input data-f="homeClass" class="w-s" value="${esc(s.homeClass)}" list="homeL" placeholder="${esc(homePH())}" aria-label="${esc(KS())}班別">` : `<input data-f="classNo" class="w-xs ${s.classNo ? '' : 'need'}" value="${esc(s.classNo)}" list="cls${s.grade}" inputmode="numeric" placeholder="班" aria-label="班號">`}</td>
    <td class="nw">${ui.nameMode === 'full' ? `<input data-f="name" value="${esc(N(s))}" class="w-s" aria-label="姓名">` : `<span title="要修改姓名請把上方「姓名」切換成全名">${esc(N(s))}</span>`}${tag2e(s)}${s.left ? `<div><span class="tag leftag" title="${esc(s.leftNote || '')}">已轉出${s.leftDate ? ' ' + esc(s.leftDate) : ''}</span></div>` : ''}</td>

    <td>${isVisit(s) ? `<div class="row nw" style="gap:4px"><input data-f="visitCase" value="${esc(s.visitCase || '')}" class="w-s" placeholder="${esc(OTH())}個管（可填）" aria-label="${esc(OTH())}的個管老師" title="只用來聯絡，不會加進教師名單"><input data-f="visitExt" value="${esc(s.visitExt || '')}" class="w-xs" placeholder="分機" aria-label="分機"></div>` : `<select data-f="caseTeacherId">${teacherOpts(s.caseTeacherId, '—')}</select>`}</td>
    <td class="c"><input type="checkbox" data-f="afterSchool" ${s.afterSchool ? 'checked' : ''} aria-label="課後班"></td>
    <td class="c"><input type="checkbox" data-f="starClass" ${s.starClass ? 'checked' : ''} aria-label="星光班"></td>
    <td><select data-f="afterGoing">${GOING.map(g => opt(g, g || '—', goingSel(s.afterGoing))).join('')}</select><input data-f="afterGoingO" class="w-s going-o" value="${esc(goingTxt(s.afterGoing))}" placeholder="去哪裡？" title="${GOING_PH}" aria-label="放學去向（其他）"${goingOther(s.afterGoing) ? '' : ' hidden'}></td>
    <td><input data-f="note" value="${esc(s.note)}" class="w-note" placeholder="備註（例：轉出原因、特殊狀況）" title="${esc(s.note)}"></td>
    <td><div class="row nw" style="gap:4px;flex-wrap:nowrap"><button class="btn sm" data-act="edit" title="障礙亞型、支持服務、雙重殊異、轉學等詳細資料">編輯</button>${s.left ? '<button class="btn sm" data-act="unleave">取消轉出</button>' : '<button class="btn sm" data-act="leave" title="學生轉學：資料保留，不再排課、不列入統計">轉出</button>'}<button class="btn sm danger" data-act="del">刪除</button></div></td></tr>`;
}
function pageStudents() {
  const u = ui.as;
  const dl = GRADES().map(g => `<datalist id="cls${g}">${DB.classes.filter(c => c.year === Y() && c.grade === g).map(c => `<option value="${esc(c.classNo)}">`).join('')}</datalist>`).join('');
  const blanks = yStudents().filter(needsClass).length;
  app.innerHTML = card(`個管學生（${Y()} 學年度）`, `${esc(stuCountText())}。表格內可直接修改，變更會自動儲存。黃色欄位代表班級尚未填寫。學生轉學請按該列最右邊的「轉出」（或按「編輯」，在視窗最下方「轉學（轉出）」辦理），資料會保留、不再排課。${isGT() ? `雙重殊異的學生請按「編輯」勾選，並填另一位個管教師。` : `${esc(OTH())}學生（只來上課、不是${esc(OWN())}老師個管的學生）也在這裡新增，類別選「${esc(OTH())}學生」。`}`, `
    <div class="row"><button class="btn pri" data-act="add">新增學生</button><button class="btn" data-act="bulk">批次貼上</button><button class="btn" data-act="promote">學年度升級</button></div>
    <div class="row"><select id="fT">${filterTOpts(u.tid)}</select><select id="fG">${gradeOpts(u.grade, '全部年級')}</select>
    <input id="fQ" placeholder="搜尋姓名或班級" value="${esc(u.q)}" class="w-l">
    <label class="row" style="gap:6px"><input type="checkbox" id="fB" ${u.blank ? 'checked' : ''}> 只看未填班級 ${blanks ? `<span class="tag warn">${blanks}</span>` : ''}</label>
    ${(n => n ? `<label class="row" style="gap:6px"><input type="checkbox" id="fL" ${u.showLeft !== false ? 'checked' : ''}> 列出已轉出學生（${n} 位）</label>` : '')(yStudentsAll().filter(s => s.left).length)}</div>
    ${dl}${homeList()}<div class="scroll" style="margin-top:12px" id="res"></div>`);
  const res = () => {
    const list = filterStudents(Object.assign({}, u, { showLeft: u.showLeft !== false })).filter(s => !u.blank || needsClass(s));
    const mini = list.map(s => `<tr data-id="${s.id}"><td class="${needsClass(s) ? 'needc' : ''}"><b>${classLabel(s)}</b></td><td><b>${esc(N(s))}</b>${tag2e(s)}${s.left ? ' <span class="tag leftag">已轉出</span>' : ''}${s.note ? `<div class="desc" style="font-size:12px">${esc(s.note)}</div>` : ''}</td><td>${esc(s.disability)}</td><td>${isVisit(s) ? `${esc(OTH())}${s.visitCase || s.visitExt ? `<div class="desc" style="font-size:11px;white-space:normal">${esc([s.visitCase, s.visitExt ? '分機 ' + s.visitExt : ''].filter(Boolean).join(' '))}</div>` : ''}` : esc(s.caseTeacherId ? tName(s.caseTeacherId) : '—')}</td>
      <td style="font-size:12px">${[s.afterSchool ? '課後' : '', s.starClass ? '星光' : '', s.afterGoing].filter(Boolean).map(esc).join('<br>') || '—'}</td><td><button class="btn sm" data-act="edit">編輯</button></td></tr>`).join('');
    $('#res').innerHTML = `<div class="wide-only"><table class="tbl"><thead><tr><th>年級</th><th>班</th><th>姓名</th><th>${DL()}</th><th>${isGT() ? '雙重殊異' : '類別'}</th><th>個管教師</th><th class="c">課後班</th><th class="c">星光班</th><th>放學去向</th><th>備註</th><th></th></tr></thead>
      <tbody>${list.map(stuRow).join('') || '<tr><td colspan="11" class="empty">沒有符合的學生</td></tr>'}</tbody></table></div>
      <div class="narrow-only"><table class="tbl mini"><thead><tr><th>班級</th><th>姓名</th><th>${DL()}</th><th>個管</th><th>課後／放學</th><th></th></tr></thead>
      <tbody>${mini || '<tr><td colspan="6" class="empty">沒有符合的學生</td></tr>'}</tbody></table></div><p class="desc">顯示 ${list.length} / ${yStudents().length} 人</p>`;

  res();

  app.onchange = e => {

    if (t.id === 'fG') { u.grade = t.value; return res(); }
    if (t.id === 'fB') { u.blank = t.checked; return res(); }
    if (t.id === 'fL') { u.showLeft = t.checked; return res(); }
    const tr = t.closest('tr[data-id]'), f = t.dataset.f; if (!tr || !f) return;
    const s = S(tr.dataset.id); if (!s) return;

    else if (f === 'grade') { s.grade = +t.value; const cn = tr.querySelector('[data-f=classNo]'); if (cn) cn.setAttribute('list', 'cls' + s.grade); }

    else if (f === 'afterGoing') { const o = tr.querySelector('[data-f=afterGoingO]'); o.hidden = t.value !== '其他'; s.afterGoing = t.value === '其他' ? (o.value.trim() || '其他') : t.value; if (!o.hidden) o.focus(); }
    else if (f === 'afterGoingO') s.afterGoing = t.value.trim() || '其他';
    else s[f] = t.value.trim();
    commit();
  };
  app.onclick = async e => {
    const a = e.target.closest('[data-act]'); if (!a) return;
    if (a.dataset.act === 'add') studentModal();

    if (a.dataset.act === 'promote') promoteModal();
    if (a.dataset.act === 'leave') return leaveModal(S(a.closest('tr').dataset.id));
    if (a.dataset.act === 'unleave') return unleave(S(a.closest('tr').dataset.id));
    if (a.dataset.act === 'del') {
      const s = S(a.closest('tr').dataset.id), nc = DB.courses.filter(c => c.studentIds.includes(s.id)).length;
      if (!await ask(`確定刪除 ${N(s)}？${nc ? `\n會同時從 ${nc} 堂課的學生名單中移除。` : ''}`, { ok: '刪除', danger: true })) return;
      const undo = removeStudent(s); commit(); res();
      toastUndo(`已刪除 ${N(s)}`, () => { undo(); commit(); pageStudents(); });
    }

async function warnLoad(tids, before) {
  for (const tid of tids) {
    const t = T(tid); if (!hasLoad(t) || t.noLoadWarn) continue;
    const L = teacherLoad(tid), B = before.get(tid);

    const r = await ask(`${t.name} 老師的節數超過了：\n・${L.msgs.filter(x => x.lv === 'over').map(x => x.text).join('\n・')}\n（基本 ${fN(L.basic)}／${fN(L.base)}、超鐘點 ${fN(L.ot)}／${fN(L.cap)}）\n\n不一定要調整。如果是人力安排不得已，可以關掉這位老師的超時提醒，之後就不會再跳出來。`, { ok: '知道了', cancel: null, alt: '關掉這位老師的提醒' });
    if (r === 'alt') { t.noLoadWarn = true; commit(); toast(`已關閉 ${t.name} 老師的超時提醒（可在排課頁重新開啟）`); pageSchedule(); }

        const r = g.length > 1 ? await ask(`「${courseTitle(course)}」一共有 ${g.length} 節（${g.map(o => slotName(slotKey(o.day, o.periodId))).join('、')}）。\n要全部刪除，還是只刪除這一節（${slotName(slotKey(course.day, course.periodId))}）？`, { ok: `全部刪除（${g.length} 節）`, alt: '只刪這一節', danger: true })
          : await ask(`確定刪除「${courseTitle(course)}」？`, { ok: '刪除', danger: true });
        if (!r) return;
        const del = r === 'alt' || g.length < 2 ? [course] : g, delIds = new Set(del.map(o => o.id));
        const snapshot = DB.courses.slice();
        DB.courses = DB.courses.filter(o => !delIds.has(o.id)); commit(); closeModal(); pageSchedule();
        toastUndo(`已刪除「${courseTitle(course)}」${del.length > 1 ? ` ${del.length} 節` : ''}`, () => { const cur = new Set(DB.courses.map(o => o.id)); DB.courses = snapshot.filter(o => cur.has(o.id) || delIds.has(o.id)).concat(DB.courses.filter(o => !snapshot.some(x => x.id === o.id))); commit(); pageSchedule(); });
        const lost = isInd(course) ? indIssues(course.studentIds.map(S).filter(Boolean)).filter(x => x.kind === 'noSlot' && cIT(course).includes(x.t)) : [];
        if (lost.length) notify(lost.map(x => x.msg).join('\n'));
      };
    }
  });
}

/* 上傳的圖片縮成 128×128 PNG，存在設定裡（會一起同步到試算表） */
function readIcon(file) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => { const im = new Image(); im.onload = () => {
      const cv = document.createElement('canvas'); cv.width = cv.height = 128; const x = cv.getContext('2d');
      const k = Math.max(128 / im.width, 128 / im.height), w = im.width * k, h = im.height * k;
      x.drawImage(im, (128 - w) / 2, (128 - h) / 2, w, h); let u = cv.toDataURL('image/png'); if (u.length > 30000) u = cv.toDataURL('image/jpeg', .85); if (u.length > 40000) u = cv.toDataURL('image/jpeg', .6); res(u);
    }; im.onerror = rej; im.src = fr.result; };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}
/* 內建圖示（常見、各平台都能顯示的表情符號） */
const ICON_EMOJI = ['📚', '📖', '✏️', '🏫', '🎒', '🍎', '🌱', '🌳', '🌻', '🌈', '☀️', '⭐', '🌟', '💡', '🧩', '🎨', '🎵', '🧠', '🤝', '❤️', '🐢', '🦉', '🐳', '🐝', '🏠', '🚀', '🎯', '🔤'];
/* 上傳圖片：先縮成最長邊 360px 的「原圖」保存（試算表一格最多約 5 萬字，所以會壓縮），
   之後隨時可以按「調整圖片位置與大小」重新放大縮小、拖曳，不必重新上傳 */
function shrinkImage(dataUrl) {
  return new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => {
      const tryAt = (max, fmt, q) => { const k = Math.min(1, max / Math.max(im.width, im.height)), cv = document.createElement('canvas'); cv.width = Math.round(im.width * k); cv.height = Math.round(im.height * k); cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height); return cv.toDataURL(fmt, q); };
      let u = tryAt(360, 'image/png'); if (u.length > 45000) u = tryAt(360, 'image/jpeg', .85); if (u.length > 45000) u = tryAt(280, 'image/jpeg', .75); if (u.length > 45000) u = tryAt(200, 'image/jpeg', .7);
      res(u);
    };
    im.onerror = rej; im.src = dataUrl;
  });
}
function iconCropModal(file) {
  const fr = new FileReader();

  fr.readAsDataURL(file);
}
function iconCropOpen(src, crop) {
    const im = new Image();
    im.onload = () => {
      const V = 240, base = Math.max(V / im.width, V / im.height);
      let z = 1, ox, oy, drag = null;
      const size = () => [im.width * base * z, im.height * base * z];
      const center = () => { const [w, h] = size(); ox = (V - w) / 2; oy = (V - h) / 2; };
      const clamp = () => { const [w, h] = size(); ox = w >= V ? Math.min(0, Math.max(V - w, ox)) : Math.max(0, Math.min(V - w, ox)); oy = h >= V ? Math.min(0, Math.max(V - h, oy)) : Math.max(0, Math.min(V - h, oy)); };
      if (crop) { z = crop.z; ox = crop.ox; oy = crop.oy; clamp(); } else center();
      openModal('調整圖示', `<div class="cropwrap"><canvas id="crCv" width="${V}" height="${V}" aria-label="拖曳移動圖片"></canvas>
        <div class="desc" style="margin:8px 0">用滑鼠或手指<b>拖曳</b>移動要顯示的部分，用下面的滑桿<b>放大縮小</b>。框內的範圍就是上方的圖示。之後也可以再回來調整。</div>
        <label class="field"><span>大小 <b id="crZv">${Math.round(z * 100)}%</b></span><input type="range" id="crZ" min="30" max="400" value="${Math.round(z * 100)}" step="5"></label>
        <div class="row" style="margin-top:8px"><button type="button" class="btn sm" data-crfit="cover">填滿方框</button><button type="button" class="btn sm" data-crfit="contain">完整顯示整張圖</button></div></div>`,
        `<button class="btn" data-close>取消</button><button class="btn pri" id="crOk">套用</button>`, m => {
        const cv = $('#crCv', m), x = cv.getContext('2d');
        const draw = () => { x.clearRect(0, 0, V, V); x.fillStyle = '#f4f8fc'; x.fillRect(0, 0, V, V); const [w, h] = size(); x.drawImage(im, ox, oy, w, h); x.strokeStyle = 'rgba(31,58,86,.35)'; x.lineWidth = 2; x.strokeRect(1, 1, V - 2, V - 2); };
        const setZ = nz => { const [w0, h0] = size(), cx = V / 2 - ox, cy = V / 2 - oy; z = nz; const [w1, h1] = size(); ox = V / 2 - cx * w1 / w0; oy = V / 2 - cy * h1 / h0; clamp(); $('#crZ', m).value = Math.round(z * 100); $('#crZv', m).textContent = Math.round(z * 100) + '%'; draw(); };
        $('#crZ', m).oninput = e => setZ(+e.target.value / 100);
        m.querySelector('.cropwrap').onclick = e => { const b = e.target.closest('[data-crfit]'); if (!b) return; z = b.dataset.crfit === 'cover' ? 1 : Math.min(V / im.width, V / im.height) / base; center(); setZ(z); };
        cv.onpointerdown = e => { drag = { x: e.clientX, y: e.clientY, ox, oy }; cv.setPointerCapture(e.pointerId); };
        cv.onpointermove = e => { if (!drag) return; const k = V / cv.getBoundingClientRect().width; ox = drag.ox + (e.clientX - drag.x) * k; oy = drag.oy + (e.clientY - drag.y) * k; clamp(); draw(); };
        cv.onpointerup = cv.onpointercancel = () => { drag = null; };
        cv.onwheel = e => { e.preventDefault(); setZ(Math.max(.3, Math.min(4, z * (e.deltaY < 0 ? 1.1 : .9)))); };
        draw();
        $('#crOk', m).onclick = () => {
          const out = document.createElement('canvas'); out.width = out.height = 128; const o = out.getContext('2d'), f = 128 / V, [w, h] = size();
          o.drawImage(im, ox * f, oy * f, w * f, h * f);
          let u = out.toDataURL('image/png'); if (u.length > 30000) u = out.toDataURL('image/jpeg', .85); if (u.length > 40000) u = out.toDataURL('image/jpeg', .6);
          Object.assign(DB.config, { iconImg: u, iconSrc: src, iconCrop: { z: Math.round(z * 1000) / 1000, ox: Math.round(ox * 10) / 10, oy: Math.round(oy * 10) / 10 } });
          commit(); renderHeader(); closeModal(); pageSchool(); toast('已更新圖示');
        };
      });
    };
    im.onerror = () => toast('無法讀取圖片');
    im.src = src;
}

    }
    if (t.dataset.rdf) {
      const r = cfg.reductions.find(x => x.id === t.closest('tr').dataset.rid); if (!r) return;
      if (t.dataset.rdf === 'hours') { const n = numOrNull(t.value); if (n === null) { t.classList.add('bad'); return toast('減授節數請填數字'); } r.hours = String(n); }
      else { if (!t.value.trim()) { t.value = r.name; return toast('原因不能空白'); } r.name = t.value.trim(); }
      t.classList.remove('bad'); commit(); toast('已更新減授'); return;
    }
    if (t.dataset.ld) {
      const v = t.value.trim(), n = numOrNull(v);
      if (v && n === null) { t.classList.add('bad'); toast('節數請填數字'); return; }
      t.classList.remove('bad');
      cfg.loads = cfg.loads || {}; const row = cfg.loads[t.dataset.ld] = Object.assign({ base: '', ot: '' }, cfg.loads[t.dataset.ld]);
      row[t.dataset.lf] = n === null ? '' : String(n); t.value = row[t.dataset.lf]; commit(); toast('已更新授課節數');
    }
    if (t.id === 'dIIB') { cfg.indCountBase = t.checked; commit(); toast(t.checked ? '間接服務會算入基本節數' : '間接服務不算基本節數（勾超鐘點的仍算超鐘點）'); }
    if (t.id === 'dCo') { cfg.coMode = t.value; commit(); toast('協同教學：' + CO_MODES[t.value]); }

}

/* ---------- 連線診斷：逐步檢查，指出是哪一步出問題 ---------- */
const DIAG_STEPS = [
  ['url', '網址格式'], ['net', '裝置網路'], ['reach', '連到 Apps Script'], ['resp', '回應內容'],
  ['key', '存取金鑰'], ['ver', '程式版本與試算表'], ['read', '讀取資料'], ['write', '寫入權限']

async function runDiagnostics(url, key, onStep) {
  const res = {};
  const set = (id, st, msg, fix, ms) => { res[id] = { st, msg, fix, ms }; onStep(res); };
  const stop = id => { DIAG_STEPS.forEach(([k]) => { if (!res[k]) res[k] = { st: 'skip', msg: '前一步未通過，尚未檢查' }; }); onStep(res); return res; };
  const timed = async (fn, ms = 45000) => {
    const ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    const tm = setTimeout(() => ctl && ctl.abort(), ms), t0 = performance.now();
    try { const r = await fn(ctl && ctl.signal); return [r, Math.round(performance.now() - t0)]; } finally { clearTimeout(tm); }
  };
  const withQ = (extra) => { const u = new URL(url); Object.entries(extra).forEach(([k, v]) => u.searchParams.set(k, v)); if (key) u.searchParams.set('key', key); u.searchParams.set('t', Date.now()); return u.toString(); };

  // 1 網址
  if (!url) { set('url', 'fail', '還沒有填網址', '請貼上 Apps Script「網頁應用程式網址」。'); return stop(); }
  if (/docs\.google\.com\/spreadsheets/.test(url)) { set('url', 'fail', '這是試算表的網址', '請到試算表的「擴充功能 → Apps Script」，按「部署 → 管理部署作業」複製「網頁應用程式網址」（開頭是 https://script.google.com/macros/s/）。'); return stop(); }
  if (/script\.google\.com\/(home|d\/|.*\/edit)/.test(url)) { set('url', 'fail', '這是 Apps Script 編輯器的網址', '請按右上角「部署 → 管理部署作業」，複製「網頁應用程式網址」，不是編輯器上方的網址。'); return stop(); }
  if (/\/dev(\?|$)/.test(url)) { set('url', 'fail', '這是測試部署（結尾 /dev）', '/dev 網址只有作者本人登入時能用。請用「新增部署作業」取得結尾是 /exec 的網址。'); return stop(); }
  if (!/^https:\/\/script\.google\.com\/macros\/(a\/[^/]+\/)?s\/[\w-]+\/exec(\?.*)?$/.test(url)) {
    if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(url)) { set('url', 'fail', '網址不是 Google Apps Script', '網址應該長得像 https://script.google.com/macros/s/一長串代碼/exec'); return stop(); }
    set('url', 'warn', '網址格式和一般不太一樣，繼續檢查', '正確格式通常是 https://script.google.com/macros/s/…/exec，請確認沒有複製不完整。');
  } else set('url', 'ok', '格式正確（…/exec）');

  // 2 網路
  if (typeof navigator !== 'undefined' && navigator.onLine === false) { set('net', 'fail', '這台裝置目前沒有網路', '請確認 Wi-Fi 或行動網路後再試。'); return stop(); }
  set('net', 'ok', '裝置已連上網路');

  // 3 連線
  let r, ms, text;
  set('reach', 'run', '連線中…');
  try { [r, ms] = await timed(sig => fetch(withQ({ action: 'meta' }), { signal: sig })); }
  catch (err) {
    if (err && err.name === 'AbortError') { set('reach', 'fail', '超過 45 秒沒有回應', 'Google 伺服器可能忙碌，或學校網路擋住了 script.google.com。請稍後再試，或換一個網路測試。'); return stop(); }
    set('reach', 'fail', '瀏覽器無法讀取 Apps Script 的回應',
      '最常見的原因依序是：① 部署時「誰可以存取」沒有選「任何人」（會被導到 Google 登入頁）；② 改了程式碼後沒有「管理部署作業 → 編輯 → 版本：新版本」重新發佈；③ 學校網路或瀏覽器外掛擋住 script.google.com。');
    return stop();
  }
  if (!r.ok) {
    const fix = r.status === 404 ? '找不到這個部署：可能已被封存、刪除，或網址複製不完整。請重新複製網頁應用程式網址。'
      : r.status >= 500 ? 'Google 伺服器錯誤，通常是程式碼執行失敗。請到 Apps Script「執行作業」查看錯誤紀錄。' : '請確認部署設定後再試。';

  }

  catch (err) {
    const t = String(text || '');
    const fix = /doGet/.test(t) ? '程式碼裡找不到 doGet：請確認 Code.gs 整份貼上並「儲存」，然後部署新版本。'
      : /accounts\.google|ServiceLogin|登入/.test(t) ? '回應是 Google 登入頁：部署時「誰可以存取」請改成「任何人」，再部署新版本。'
      : '回應不是本系統的資料格式：請確認貼上的是本系統的 Code.gs，而不是其他程式。';

  }

    if (j.code === 'KEY' || /金鑰/.test(j.error || '')) { set('key', 'fail', '存取金鑰不一致', key ? '網頁上填的金鑰和 Apps Script 程式碼第 15 行 SECRET 引號裡的字不同。大小寫都要一模一樣。' : '試算表已經設定了存取金鑰，請在上方「存取金鑰」欄填入相同的金鑰（忘記的話，打開 Apps Script 看程式碼第 15 行 SECRET 引號裡的字）。'); return stop(); }
    set('key', 'ok', key ? '金鑰正確' : '未設定金鑰');
    set('ver', 'fail', 'Apps Script 執行時發生錯誤：' + (j.error || '未知錯誤'),
      j.code === 'NO_SHEET' ? '這份程式沒有綁定試算表。請打開 Google 試算表，從「擴充功能 → Apps Script」貼上程式碼並重新部署。' : '請到 Apps Script「執行作業」查看詳細錯誤，或重新貼上最新版 Code.gs。');
    return stop();
  }
  set('key', key ? 'ok' : 'warn', key ? '金鑰正確' : '還沒有設定存取金鑰（建議設定，保護學生資料）', key ? '' : '沒有金鑰時，拿到網址的人就能讀取資料。設定方法：在上方填一組金鑰 → 按「複製程式碼」重新貼到 Apps Script → 部署「管理部署作業」選新版本。');

  // 6 版本
  const ver = +j.version || 1;
  if (ver === 2) set('ver', 'warn', `程式版本 v2；試算表「${j.spreadsheet || ''}」`, '「間接服務規劃」需要新版 Code.gs（v3）才會存到雲端。請貼上最新版 Code.gs，並用「管理部署作業 → 編輯 → 新版本」發佈。');
  else if (ver < 2) set('ver', 'warn', '使用舊版 Code.gs（仍可正常同步）', '舊版無法檢查寫入權限與試算表名稱。建議貼上最新版 Code.gs，並用「管理部署作業 → 編輯 → 新版本」發佈。');
  else set('ver', 'ok', `程式版本 v${ver}；試算表「${j.spreadsheet || ''}」` + (j.sheets ? `，共 ${j.sheets.length} 個工作表` : ''));

  // 7 讀取
  set('read', 'run', '讀取中…');
  try {
    const [r2, ms2] = await timed(sig => fetch(withQ({}), { signal: sig }), 90000);
    const j2 = await r2.json();
    if (!j2.ok) throw new Error(j2.error || '讀取失敗');
    const d = j2.data || {};
    const n = k => (d[k] || []).length;
    if (!n('years') && !n('students') && !n('teachers')) set('read', 'warn', '可以讀取，但試算表目前是空的', '第一次使用是正常的。按「上傳到雲端」後會自動建立工作表。', ms2);
    else set('read', 'ok', `讀到 ${n('years')} 個學年度、${n('teachers')} 位教師、${n('students')} 筆學生、${n('courses')} 堂課`, '', ms2);
  } catch (err) {

    if (err && err.name === 'AbortError') set('read', 'warn', '讀取超過 90 秒還沒完成（Google 伺服器這次比較慢）',
      `這不是資料太大（目前整份資料約 ${Math.max(1, Math.round(JSON.stringify(toSheet(fullData())).length / 1024))} KB，Google 試算表可以輕鬆處理），也不代表同步失敗。請以上方的同步狀態為準；想確認的話，過幾分鐘再按「再測一次」。`);

}
function diagHTML(res) {
  const icon = { ok: '✓', fail: '✕', warn: '!', skip: '–', run: '…' };
  return `<ul class="diag">${DIAG_STEPS.map(([k, label], i) => {
    const r = res[k] || { st: 'skip', msg: '等待中' };
    return `<li class="${r.st}"><span class="ic">${icon[r.st] || '–'}</span><div style="flex:1"><b>${i + 1}. ${label}</b><div class="dm">${esc(r.msg || '')}</div>${r.fix ? `<div class="fix">${esc(r.fix)}</div>` : ''}</div>${r.ms != null ? `<span class="ms">${r.ms} ms</span>` : ''}</li>`;
  }).join('')}</ul>`;
}
function diagSummary(res) {
  const vals = Object.values(res);
  const f = DIAG_STEPS.find(([k]) => res[k] && res[k].st === 'fail');
  if (f) return `<div class="banner bad" style="margin-top:12px"><b>連線有問題：第 ${DIAG_STEPS.indexOf(f) + 1} 步「${f[1]}」未通過</b>，請依照下方紅色說明修正後再測一次。</div>`;
  if (vals.some(v => v.st === 'run')) return '';
  return vals.some(v => v.st === 'warn') ? `<div class="banner warn" style="margin-top:12px"><b>可以使用</b>，但有黃色提醒建議處理。</div>` : `<div class="banner info" style="margin-top:12px;background:var(--ok-soft);color:var(--ok)"><b>連線正常 ✓</b> 可以開始同步。</div>`;
}
